<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WAVE STUDIO — line + fill</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.8/static/pretendard.css" />
  <style>
    :root {
      --primary: #0a66c2;
      --bg: #ffffff;
      --ink: #222;
      --ink-dim: #555;
      --panel: rgba(245,245,245,0.95);
      --border: #e2e2e2;
      --radius: 18px;
      --radius-sm: 14px;
      --pad-sm: 8px 12px;
      --pad-md: 10px 16px;
      --pad-lg: 12px 18px;
      --fs-xs: 11px;
      --fs-sm: 12px;
      --fs-md: 13px;
      --fs-lg: 16px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Pretendard", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      line-height: 1.4;
      overflow: hidden;
    }
    #app { position: relative; width: 100vw; height: 100vh; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* Top-left */
    #home-button {
      position: fixed; left: 16px; top: 14px; z-index: 1001;
      width: 44px; height: 44px; border-radius: 999px;
      display: grid; place-items: center;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
    }
    #home-button svg { width: 22px; height: 22px; fill: #666; }

    .title-wrap {
      position: fixed; left: 74px; top: 16px; z-index: 1000;
      display: flex; gap: 8px; align-items: baseline; user-select: none;
    }
    .brand { font-weight: 700; letter-spacing: 0.02em; font-size: 15px; }
    .tag { font-size: var(--fs-xs); color: var(--ink-dim); border: 1px solid var(--border); padding: 2px 10px; border-radius: 999px; }

    /* Mode toggle (center-top) */
    .mode-toggle {
      position: fixed; left: 50%; top: 16px; transform: translateX(-50%);
      z-index: 1000; background: var(--panel); border: 1px solid var(--border);
      padding: var(--pad-sm); border-radius: 999px; font-size: var(--fs-sm);
      cursor: pointer; user-select: none;
    }

    /* Guides */
    .guide {
      position: fixed; left: 50%; top: 60px; transform: translateX(-50%);
      z-index: 1000; color: var(--ink-dim); font-size: var(--fs-xs);
      background: var(--panel); border: 1px solid var(--border);
      padding: 6px 10px; border-radius: 999px;
    }

    /* Bottom-left controls */
    .controls {
      position: fixed; left: 16px; bottom: 16px; z-index: 1000;
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      background: var(--panel); border: 1px solid var(--border);
      padding: 10px; border-radius: var(--radius);
    }
    .btn, .seg, .select, input[type="color"] {
      font-size: var(--fs-sm); color: var(--ink); background: #fff;
      border: 1px solid var(--border); padding: 8px 14px;
      border-radius: 999px; cursor: pointer;
    }
    .btn[aria-pressed="true"], .seg[aria-checked="true"] { color: var(--primary); border-color: var(--primary); }
    .seg-group { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
    .seg { border: none; border-right: 1px solid var(--border); background: #fff; }
    .seg:last-child { border-right: none; }
    input[type="color"] { width: 34px; height: 34px; padding: 0; border-radius: 50%; background: transparent; }

    /* Right options panel (narrow width: 220px) */
    .panel {
      position: fixed; right: 16px; bottom: 16px; z-index: 1000; width: 220px;
      background: var(--panel); border: 1px solid var(--border);
      padding: 12px; border-radius: var(--radius); display: grid; gap: 10px;
    }
    .panel h3 { margin: 0; font-size: var(--fs-md); }
    .row { display: grid; grid-template-columns: 1fr 70px; align-items: center; gap: 10px; }
    .row label { font-size: var(--fs-sm); color: var(--ink-dim); }
    .row input[type="range"], .row input[type="number"] { width: 100%; }
    .row input[type="number"] { font-size: var(--fs-sm); padding: 6px 10px; border: 1px solid var(--border); border-radius: 999px; background: #fff; }
    .switch { display: flex; align-items: center; gap: 8px; }
    .switch input { margin: 0; }
    .bar { height: 1px; background: var(--border); margin: 4px 0 6px; }

    .falling-text {
      position: absolute; font-size: 20px; pointer-events: none;
      writing-mode: vertical-lr; text-orientation: upright; letter-spacing: 5px;
      padding: 10px; display: flex; gap: 20px; z-index: 5;
    }
    .korean { font-weight: 600; color: #333; }

    /* Focus */
    .btn:focus, .seg:focus, .select:focus, input:focus { outline: 2px solid var(--primary); outline-offset: 2px; }

    @media (max-width: 960px) {
      .panel { width: calc(100vw - 32px); left: 16px; right: 16px; bottom: 70px; }
      .controls { left: 16px; right: 16px; justify-content: space-between; }
      .title-wrap { display: none; }
      .guide { display: none; }
    }
  </style>
</head>
<body>
  <a id="home-button" href="index.html#list-section" aria-label="홈으로">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
  </a>

  <div class="title-wrap">
    <div class="brand">WAVE STUDIO</div>
    <div class="tag">interactive / line+fill</div>
  </div>

  <button class="mode-toggle" id="modeToggle" aria-pressed="false">모드: 단어의 파동</button>
  <div class="guide" id="guide">1–9 단어 · Space 파형 · ←/→ 타입</div>

  <div id="app">
    <canvas id="waveCanvas" aria-label="파동 캔버스"></canvas>
  </div>

  <div class="controls" role="toolbar" aria-label="메인 컨트롤">
    <input type="color" id="colorPicker" value="#0a66c2" aria-label="색상" />
    <div class="seg-group" role="radiogroup" aria-label="렌더 모드" id="renderGroup">
      <button class="seg" role="radio" aria-checked="true" data-mode="both">Both</button>
      <button class="seg" role="radio" aria-checked="false" data-mode="line">Line</button>
      <button class="seg" role="radio" aria-checked="false" data-mode="fill">Fill</button>
    </div>
    <button class="btn" id="toggleInteractive" aria-pressed="true">인터랙션 On</button>
    <button class="btn" id="waveTypeBtn">웨이브 타입</button>
    <button class="btn" id="saveBtn">PNG 저장</button>
    <button class="btn" id="resetBtn">리셋</button>
  </div>

  <aside class="panel" aria-label="세부 옵션">
    <h3>옵션</h3>
    <div class="row">
      <label for="lineWidth">선 두께</label>
      <input type="range" id="lineWidth" min="0.5" max="4" step="0.1" value="1.4" />
    </div>
    <div class="row">
      <label for="lineAlpha">선 투명도</label>
      <input type="range" id="lineAlpha" min="0.1" max="1.0" step="0.05" value="0.85" />
    </div>
    <div class="row">
      <label for="amplitude">진폭</label>
      <input type="range" id="amplitude" min="20" max="120" step="1" value="80" />
    </div>
    <div class="row">
      <label for="speed">속도</label>
      <input type="range" id="speed" min="0.02" max="0.12" step="0.005" value="0.05" />
    </div>
    <div class="row">
      <label for="quality">품질</label>
      <input type="range" id="quality" min="400" max="2000" step="50" value="1000" />
    </div>
    <div class="switch">
      <input type="checkbox" id="gridToggle" />
      <label for="gridToggle">가이드 그리드</label>
    </div>
    <div class="switch">
      <input type="checkbox" id="crosshairToggle" />
      <label for="crosshairToggle">마우스 십자선</label>
    </div>
    <div class="bar"></div>
    <div class="switch">
      <input type="checkbox" id="textBounceToggle" checked />
      <label for="textBounceToggle">텍스트 잔향</label>
    </div>
  </aside>

  <script>
    class CombinedWaveExperience {
      constructor() {
        this.canvas = document.getElementById("waveCanvas");
        this.ctx = this.canvas.getContext("2d");

        // UI
        this.modeToggle = document.getElementById("modeToggle");
        this.colorPicker = document.getElementById("colorPicker");
        this.renderGroup = document.getElementById("renderGroup");
        this.toggleInteractiveBtn = document.getElementById("toggleInteractive");
        this.waveTypeBtn = document.getElementById("waveTypeBtn");
        this.saveBtn = document.getElementById("saveBtn");
        this.resetBtn = document.getElementById("resetBtn");

        // Options
        this.lineWidthEl = document.getElementById("lineWidth");
        this.lineAlphaEl = document.getElementById("lineAlpha");
        this.amplitudeEl = document.getElementById("amplitude");
        this.speedEl = document.getElementById("speed");
        this.qualityEl = document.getElementById("quality");
        this.gridToggle = document.getElementById("gridToggle");
        this.crosshairToggle = document.getElementById("crosshairToggle");
        this.textBounceToggle = document.getElementById("textBounceToggle");

        // State
        this.isTextMode = true;
        this.isInteractive = true;
        this.renderMode = "both";
        this.time = 0;
        this.baseAmplitude = parseFloat(this.amplitudeEl.value);
        this.strokeAlpha = parseFloat(this.lineAlphaEl.value);
        this.strokeWidth = parseFloat(this.lineWidthEl.value);
        this.speed = parseFloat(this.speedEl.value);
        this.pixelTarget = parseInt(this.qualityEl.value, 10);

        this.fallingTexts = [];
        this.waves = [];
        this.mouse = { x: null, y: null, down: false };
        this.waveTypes = [
          { name: "유기적", generate: (x,t,A) => A*(Math.sin(x*0.01+t*0.3)+Math.sin(x*0.02-t*0.2)*0.5+Math.sin(x*0.005+t*0.1)*0.25) },
          { name: "유동적", generate: (x,t,A) => A*Math.sin(x*(0.015+Math.sin(t*0.2)*0.1)+t*0.4+Math.sin(x*0.03)*0.5) },
          { name: "난류",   generate: (x,t,A) => A*(Math.sin(x*0.02+t*0.4)*Math.sin(x*0.01+Math.sin(t*0.3)*2)*(1+Math.sin(t*0.1))) }
        ];
        this.waveIndex = 0;
        this.numberTexts = {
          "1": { ko: "안녕하세요" }, "2": { ko: "이 사이트는" }, "3": { ko: "다양하고" },
          "4": { ko: "실험적인" }, "5": { ko: "인터랙션과" }, "6": { ko: "애니메이션을 보여주는" },
          "7": { ko: "반응형 웹사이트입니다." }, "8": { ko: "천천히 재미있게" }, "9": { ko: "사이트를 즐겨주세요." },
        };

        this.setupCanvas();
        this.bindUI();
        this.animate();
      }

      setupCanvas() {
        const resize = () => {
          const dpr = window.devicePixelRatio || 1;
          this.canvas.width = window.innerWidth * dpr;
          this.canvas.height = window.innerHeight * dpr;
          this.ctx.setTransform(1,0,0,1,0,0);
          this.ctx.scale(dpr, dpr);
          this.w = window.innerWidth;
          this.h = window.innerHeight;
          this.centerY = this.h * 0.5;
          this.colorChangeY = this.centerY - 100;
        };
        resize();
        window.addEventListener("resize", resize);

        this.canvas.addEventListener("mousemove", (e) => {
          const r = this.canvas.getBoundingClientRect();
          this.mouse.x = e.clientX - r.left;
          this.mouse.y = e.clientY - r.top;
          if (!this.isTextMode && this.mouse.down && this.isInteractive) {
            this.addInteractionPoint(this.mouse.x, this.mouse.y);
          }
        });
        this.canvas.addEventListener("mousedown", () => { this.mouse.down = true; });
        this.canvas.addEventListener("mouseup", () => { this.mouse.down = false; });
        this.canvas.addEventListener("mouseleave", () => { this.mouse.x = this.mouse.y = null; this.mouse.down = false; });
      }

      bindUI() {
        const updateModeLabel = () => {
          this.modeToggle.textContent = `모드: ${this.isTextMode ? "단어의 파동" : "물결의 흐름"}`;
          this.modeToggle.setAttribute("aria-pressed", String(!this.isTextMode));
        };
        this.modeToggle.addEventListener("click", () => { this.isTextMode = !this.isTextMode; updateModeLabel(); });
        updateModeLabel();

        this.renderGroup.addEventListener("click", (e) => {
          const btn = e.target.closest(".seg"); if (!btn) return;
          [...this.renderGroup.querySelectorAll(".seg")].forEach(b => b.setAttribute("aria-checked", "false"));
          btn.setAttribute("aria-checked", "true");
          this.renderMode = btn.dataset.mode;
        });

        this.toggleInteractiveBtn.addEventListener("click", () => {
          this.isInteractive = !this.isInteractive;
          this.toggleInteractiveBtn.setAttribute("aria-pressed", String(this.isInteractive));
          this.toggleInteractiveBtn.textContent = this.isInteractive ? "인터랙션 On" : "인터랙션 Off";
        });

        this.waveTypeBtn.addEventListener("click", () => {
          this.waveIndex = (this.waveIndex + 1) % this.waveTypes.length;
          this.waveTypeBtn.textContent = `웨이브 타입 (${this.waveTypes[this.waveIndex].name})`;
        });

        this.saveBtn.addEventListener("click", () => this.savePNG());
        this.resetBtn.addEventListener("click", () => this.reset());

        this.lineWidthEl.addEventListener("input", () => this.strokeWidth = parseFloat(this.lineWidthEl.value));
        this.lineAlphaEl.addEventListener("input", () => this.strokeAlpha = parseFloat(this.lineAlphaEl.value));
        this.amplitudeEl.addEventListener("input", () => this.baseAmplitude = parseFloat(this.amplitudeEl.value));
        this.speedEl.addEventListener("input", () => this.speed = parseFloat(this.speedEl.value));
        this.qualityEl.addEventListener("input", () => this.pixelTarget = parseInt(this.qualityEl.value, 10));

        window.addEventListener("keydown", (e) => {
          const k = e.key;
          if (this.numberTexts[k]) {
            const x = Math.random() * this.canvas.width;
            this.fallingTexts.push(this.createFallingText(this.numberTexts[k], x));
          }
          if (k === " "){ e.preventDefault(); this.randomizeWave(); }
          if (k === "ArrowRight"){ this.waveIndex = (this.waveIndex + 1) % this.waveTypes.length; }
          if (k === "ArrowLeft"){ this.waveIndex = (this.waveIndex - 1 + this.waveTypes.length) % this.waveTypes.length; }
          if (k === "ArrowUp" || k === "ArrowDown"){
            this.isInteractive = !this.isInteractive;
            this.toggleInteractiveBtn.setAttribute("aria-pressed", String(this.isInteractive));
            this.toggleInteractiveBtn.textContent = this.isInteractive ? "인터랙션 On" : "인터랙션 Off";
          }
          if (k.toLowerCase() === "s") this.savePNG();
          if (k.toLowerCase() === "r") this.reset();
        });
      }

      reset() {
        this.fallingTexts = [];
        this.waves = [];
        this.baseAmplitude = 80;
        this.strokeAlpha = 0.85;
        this.strokeWidth = 1.4;
        this.speed = 0.05;
        this.pixelTarget = 1000;
        this.lineWidthEl.value = this.strokeWidth;
        this.lineAlphaEl.value = this.strokeAlpha;
        this.amplitudeEl.value = this.baseAmplitude;
        this.speedEl.value = this.speed;
        this.qualityEl.value = this.pixelTarget;
        this.renderMode = "both";
        [...this.renderGroup.querySelectorAll(".seg")].forEach((b, i) => b.setAttribute("aria-checked", i===0 ? "true":"false"));
      }

      savePNG() {
        const url = this.canvas.toDataURL("image/png");
        const a = document.createElement("a");
        const t = new Date().toISOString().replace(/[:.]/g, "-");
        a.href = url; a.download = `wave-${t}.png`; a.click();
      }

      addInteractionPoint(x, y) {
        const p = { x, y, t: performance.now(), intensity: Math.random()*0.5+0.5, decay: Math.random()*0.01+0.005 };
        (this.interactionPoints ??= []).push(p);
        if (this.interactionPoints.length > 20) this.interactionPoints.shift();
      }

      createFallingText(textObj, x) {
        const el = document.createElement("div");
        el.className = "falling-text";
        const ko = document.createElement("span");
        ko.className = "korean";
        ko.textContent = textObj.ko;
        el.appendChild(ko);
        el.style.left = x + "px";
        el.style.top = "0px";
        document.body.appendChild(el);
        return { element: el, x, y: 0, speed: 3, colorChanged: false, waveCreated: false };
      }

      updateFallingTexts() {
        const bounce = this.textBounceToggle.checked;
        this.fallingTexts.forEach((t, i) => {
          t.y += t.speed;
          const wobble = bounce ? Math.sin(performance.now()/500) * 2 : 0;
          t.element.style.transform = `translate(-50%, ${t.y}px) translateX(${wobble}px)`;
          t.element.style.top = "0px";

          if (t.y >= this.colorChangeY && !t.colorChanged) {
            const k = t.element.querySelector(".korean"); k.style.color = "#000"; t.colorChanged = true;
          }
          if (t.y >= this.centerY && !t.waveCreated) { this.generateWave(t.x); t.waveCreated = true; }
          if (t.y >= this.centerY + 50) {
            t.element.style.opacity = "0";
            setTimeout(() => { if (t.element && t.element.parentNode) t.element.remove(); }, 400);
            this.fallingTexts.splice(i,1);
          }
        });
      }

      generateWave(x) {
        const amp = Math.random()*10 + 60;
        const freq = Math.random()*0.02 + 0.01;
        this.waves.push({ amplitude: amp, frequency: freq, offset: 0, x, alpha: 0, color: this.colorPicker.value });
      }

      calculateWaveHeight(x, t) {
        const W = this.waveTypes[this.waveIndex];
        let h = W.generate(x, t, this.baseAmplitude);
        if (this.isInteractive && this.interactionPoints) {
          this.interactionPoints = this.interactionPoints.filter(p => (performance.now()-p.t)/1000 < 2);
          this.interactionPoints.forEach(p => {
            const d = Math.abs(x - p.x);
            const life = Math.max(0, 1 - ((performance.now()-p.t)/1000) * p.decay);
            const influence = p.intensity * life * Math.max(0, 1 - d/200);
            h += Math.sin(d*0.1) * influence * 30;
          });
          if (this.mouse.x != null) {
            const dm = Math.abs(x - this.mouse.x);
            const mi = Math.max(0, 1 - dm/250);
            h += Math.sin(this.time*2) * mi * 20;
          }
        }
        return h;
      }

      drawGrid() {
        if (!this.gridToggle.checked) return;
        const step = Math.max(40, Math.round(this.w / 24));
        this.ctx.save();
        this.ctx.strokeStyle = "#e7e7e7";
        this.ctx.lineWidth = 1;
        this.ctx.beginPath();
        for (let x = 0; x <= this.w; x += step) { this.ctx.moveTo(x, 0); this.ctx.lineTo(x, this.h); }
        for (let y = 0; y <= this.h; y += step) { this.ctx.moveTo(0, y); this.ctx.lineTo(this.w, y); }
        this.ctx.stroke();
        this.ctx.restore();
      }

      drawCrosshair() {
        if (!this.crosshairToggle.checked || this.mouse.x == null) return;
        this.ctx.save();
        this.ctx.strokeStyle = "#bbb";
        this.ctx.lineWidth = 1;
        this.ctx.beginPath();
        this.ctx.moveTo(this.mouse.x, 0); this.ctx.lineTo(this.mouse.x, this.h);
        this.ctx.moveTo(0, this.mouse.y); this.ctx.lineTo(this.w, this.mouse.y);
        this.ctx.stroke();
        this.ctx.restore();
      }

      drawTextMode() {
        this.ctx.clearRect(0, 0, this.w, this.h);
        this.ctx.fillStyle = "#fff";
        this.ctx.fillRect(0, 0, this.w, this.h);

        const col = this.colorPicker.value;
        const r = parseInt(col.slice(1,3),16), g = parseInt(col.slice(3,5),16), b = parseInt(col.slice(5,7),16);
        this.ctx.fillStyle = `rgba(${r},${g},${b},0.18)`;
        this.ctx.fillRect(0, this.centerY, this.w, this.h - this.centerY);

        this.waves.forEach(w => {
          const rr = parseInt((w.color||col).slice(1,3),16);
          const gg = parseInt((w.color||col).slice(3,5),16);
          const bb = parseInt((w.color||col).slice(5,7),16);

          if (this.renderMode !== "line") {
            this.ctx.fillStyle = `rgba(${rr},${gg},${bb},${0.6 - w.alpha*0.6})`;
            this.ctx.beginPath();
            for (let x=0; x<this.w; x++) {
              const d = Math.abs(x - w.x);
              const amp = w.amplitude * Math.sin(performance.now()*0.002 + w.offset) * Math.exp(-d/500);
              const y = this.centerY + Math.sin(x*w.frequency + w.offset) * amp;
              this.ctx.lineTo(x, y);
            }
            this.ctx.lineTo(this.w, this.h); this.ctx.lineTo(0, this.h); this.ctx.closePath(); this.ctx.fill();
          }

          if (this.renderMode !== "fill") {
            this.ctx.beginPath();
            for (let x=0; x<this.w; x++) {
              const d = Math.abs(x - w.x);
              const amp = w.amplitude * Math.sin(performance.now()*0.002 + w.offset) * Math.exp(-d/500);
              const y = this.centerY + Math.sin(x*w.frequency + w.offset) * amp;
              if (x===0) this.ctx.moveTo(x, y); else this.ctx.lineTo(x, y);
            }
            this.ctx.globalAlpha = this.strokeAlpha * (1 - w.alpha*0.5);
            this.ctx.strokeStyle = w.color || col;
            this.ctx.lineWidth = this.strokeWidth;
            this.ctx.stroke();
            this.ctx.globalAlpha = 1;
          }

          w.offset += 0.05;
          w.alpha += 0.005;
        });
        this.waves = this.waves.filter(w => w.alpha < 1);

        this.drawGrid();
        this.drawCrosshair();
        this.updateFallingTexts();
      }

      drawGalleryMode() {
        this.ctx.clearRect(0, 0, this.w, this.h);
        this.ctx.fillStyle = "#fff";
        this.ctx.fillRect(0, 0, this.w, this.h);
        const step = Math.max(1, Math.floor(this.w / this.pixelTarget));
        const col = this.colorPicker.value;

        if (this.renderMode !== "fill") {
          this.ctx.beginPath();
          this.ctx.moveTo(0, this.centerY);
          for (let x=0; x<this.w; x+=step) {
            const y = this.centerY + this.calculateWaveHeight(x, this.time);
            this.ctx.lineTo(x, y);
          }
          this.ctx.strokeStyle = col;
          this.ctx.lineWidth = Math.max(this.strokeWidth, 1);
          this.ctx.globalAlpha = this.strokeAlpha;
          this.ctx.stroke();
          this.ctx.globalAlpha = 1;
        }

        if (this.renderMode !== "line") {
          this.ctx.beginPath();
          this.ctx.moveTo(0, this.centerY);
          for (let x=0; x<this.w; x+=step) {
            const y = this.centerY + this.calculateWaveHeight(x, this.time);
            this.ctx.lineTo(x, y);
          }
          this.ctx.lineTo(this.w, this.h); this.ctx.lineTo(0, this.h); this.ctx.closePath();
          const r = parseInt(col.slice(1,3),16), g = parseInt(col.slice(3,5),16), b = parseInt(col.slice(5,7),16);
          this.ctx.fillStyle = `rgba(${r},${g},${b},0.12)`;
          this.ctx.fill();
        }

        this.drawGrid();
        this.drawCrosshair();
      }

      randomizeWave() { this.baseAmplitude = 50 + Math.random()*50; this.amplitudeEl.value = this.baseAmplitude; }

      animate() {
        this.time += this.speed;
        if (this.isTextMode) this.drawTextMode();
        else this.drawGalleryMode();
        requestAnimationFrame(() => this.animate());
      }
    }

    const app = new CombinedWaveExperience();
  </script>
</body>
