<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>확장된 타이포그래피 애플리케이션</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Pretendard:wght@300;400;500;700;900&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Pretendard","Noto Sans KR",sans-serif;background-color:#fff;color:#000;
  height:100vh;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  min-height:100vh;min-height:-webkit-fill-available;
}
html{height:-webkit-fill-available}
#home-button{
  position:fixed;left:20px;top:20px;z-index:2001;width:44px;height:44px;background:#fff;border:1px solid #ddd;border-radius:50%;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s ease;box-shadow:0 2px 8px rgba(0,0,0,.08)
}
#home-button:hover{background:#f8f9fa;border-color:#bbb;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
#home-button svg{width:20px;height:20px;fill:#666;transition:all .2s ease}
#home-button:hover svg{fill:#333}
.tab-container{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:1000;padding:8px;background:rgba(255,255,255,.95);
  border:1px solid #e8e9ea;border-radius:24px;backdrop-filter:blur(10px);box-shadow:0 2px 12px rgba(0,0,0,.08)
}
.tab-button{
  padding:8px 16px;border:1px solid #e8e9ea;background:#fff;border-radius:20px;cursor:pointer;transition:all .2s ease;color:#666;font-weight:400;font-size:13px;letter-spacing:.5px
}
.tab-button:hover{background:#f8f9fa;border-color:#ddd;color:#333}
.tab-button.active{background:#000;color:#fff;border-color:#000}

.module{width:100%;height:100vh;position:absolute;top:0;left:0;opacity:0;pointer-events:none;transition:opacity .3s ease}
.module.active{opacity:1;pointer-events:auto}

/* Text Drawing */
#text-drawing-module{background:#fff;cursor:crosshair}
#canvas{position:absolute;inset:0;width:100%;height:100%}
#controls{
  position:fixed;bottom:20px;left:20px;background:rgba(255,255,255,.95);border:1px solid #e8e9ea;padding:16px;border-radius:12px;z-index:1000;backdrop-filter:blur(10px);
  box-shadow:0 4px 16px rgba(0,0,0,.08);max-height:calc(100vh - 120px);overflow-y:auto
}
#controls button,#controls select{
  margin:3px;padding:8px 14px;cursor:pointer;border:1px solid #e8e9ea;border-radius:20px;background:#fff;color:#666;font-weight:400;font-size:12px;transition:all .2s ease
}
#controls button:hover,#controls select:hover{background:#f8f9fa;color:#333;border-color:#ddd}
#controls button.active{background:#000;color:#fff;border-color:#000}
.color-option{display:inline-block;width:24px;height:24px;margin:3px;border-radius:50%;cursor:pointer;border:2px solid #e8e9ea;transition:all .2s ease;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.color-option:hover{transform:scale(1.1);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.color-option.selected{border:3px solid #000;transform:scale(1.15)}
#instructions{
  position:fixed;top:84px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);border:1px solid #e8e9ea;padding:12px 20px;border-radius:20px;text-align:center;font-size:13px;z-index:1000;font-weight:400;color:#666;backdrop-filter:blur(10px);box-shadow:0 2px 8px rgba(0,0,0,.08)
}
.separator{height:1px;background:#e8e9ea;margin:12px 0}
.control-group{margin:8px 0}
.control-label{display:block;font-size:11px;color:#666;margin-bottom:6px;font-weight:500}

/* Playground */
#playground-module{display:flex;justify-content:center;align-items:center;background:#fff}
#app{text-align:center;user-select:none;position:relative;width:100%;max-width:800px;padding:20px}
#text-container{
  font-size:8vw;font-weight:300;color:#000;cursor:grab;transition:all .3s ease;display:inline-block;position:relative;white-space:normal;word-break:keep-all;max-width:90%;
  text-align:center;width:auto;overflow-wrap:break-word;line-height:1.2;padding:0 20px
}
#text-container:hover{transform:scale(1.01)}
#text-container:active{cursor:grabbing}
#playground-controls{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);border:1px solid #e8e9ea;padding:12px 20px;border-radius:20px;display:flex;gap:12px;align-items:center;z-index:100;
  backdrop-filter:blur(10px);box-shadow:0 4px 16px rgba(0,0,0,.08);flex-wrap:wrap;max-width:90%
}
#playground-controls select,#textInput{padding:8px 12px;border:1px solid #e8e9ea;border-radius:8px;font-size:13px;background:#fff;color:#666;transition:all .2s ease}
#playground-controls select:hover,#textInput:hover{background:#f8f9fa;border-color:#ddd;color:#333}
.particle{position:absolute;pointer-events:none;font-size:20px;opacity:0;z-index:-1;color:#000;animation:particleFloat 1.5s ease-out forwards}
@keyframes particleFloat{0%{opacity:1;transform:scale(1) rotate(0deg)}100%{opacity:0;transform:scale(.3) rotate(180deg) translateY(-100px)}}
#color-picker{width:36px;height:32px;border:1px solid #e8e9ea;border-radius:6px;background:#fff;transition:all .2s ease;cursor:pointer}
#mode-indicator{
  position:fixed;top:84px;left:50%;transform:translateX(-50%);color:#666;padding:8px 16px;font-size:13px;background:rgba(255,255,255,.95);border:1px solid #e8e9ea;border-radius:20px;backdrop-filter:blur(10px);box-shadow:0 2px 8px rgba(0,0,0,.08)
}
#help-text{
  position:fixed;bottom:88px;left:50%;transform:translateX(-50%);color:#666;padding:8px 16px;border-radius:16px;font-size:12px;opacity:.7;background:rgba(255,255,255,.95);border:1px solid #e8e9ea;backdrop-filter:blur(10px);box-shadow:0 2px 8px rgba(0,0,0,.06)
}

/* Typography */
#typography-module{display:flex;justify-content:center;align-items:center;background:#fff;cursor:none}
#container{width:100%;height:100%;position:relative}
#sentences{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;margin:0;gap:0;padding:10vh 5vw 5vh;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none
}
#sentences::-webkit-scrollbar{display:none}
.sentence{width:100%;text-align:center;font-weight:300;font-size:3vh;line-height:1.8;opacity:.25;transition:all .3s ease;white-space:normal;padding:0 15%;word-break:keep-all;overflow-wrap:break-word;color:#000;will-change:opacity,transform}
.word{display:inline-block;position:relative;margin:0 .5vw;transition:all .3s ease;color:#000;will-change:transform}
.word.active{transform:scale(1.2);font-weight:500;opacity:1}
.word:hover{transform:scale(1.05) translateY(-2px);opacity:.7}
.focused{opacity:.8}
#cursor{position:absolute;width:12px;height:12px;border-radius:50%;background:transparent;border:1px solid #666;pointer-events:none;transform:translate(-50%,-50%);z-index:1000;transition:all .2s ease}
#cursor-dot{position:absolute;width:3px;height:3px;border-radius:50%;background:#666;pointer-events:none;transform:translate(-50%,-50%);z-index:1001}
.letter{position:absolute;font-weight:300;pointer-events:none;transform-origin:center;opacity:0;color:#000;animation:letterFloat 1.5s ease-out forwards}
@keyframes letterFloat{0%{transform:translateY(0) rotate(0deg) scale(1);opacity:1}20%{opacity:1;transform:translateY(-20px) rotate(10deg) scale(1.1)}100%{transform:translateY(-150px) rotate(45deg) scale(.5);opacity:0}}
.key-display{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:15vh;font-weight:200;color:#000;opacity:0;pointer-events:none;transition:all .3s ease}
.wave{position:absolute;border:1px solid #666;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;animation:waveExpand 1.5s ease-out forwards}
@keyframes waveExpand{0%{width:0;height:0;opacity:.4;border-width:1px}50%{opacity:.2;border-width:1px}100%{width:500px;height:500px;opacity:0;border-width:.5px}}
#typing-area{
  position:fixed;width:80%;max-width:1000px;text-align:center;bottom:120px;left:50%;transform:translateX(-50%);font-size:24px;font-weight:300;z-index:10;opacity:0;transition:all .3s ease;padding:16px;border-radius:20px;
  white-space:normal;word-break:keep-all;overflow-wrap:break-word;line-height:1.5;min-height:56px;color:#000;background:rgba(255,255,255,.95);border:1px solid #e8e9ea;backdrop-filter:blur(10px);box-shadow:0 4px 16px rgba(0,0,0,.08)
}
.typing-instruction{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);opacity:.6;font-size:13px;width:100%;text-align:center;padding:10px 0;z-index:9;color:#666}
#hidden-input{position:fixed;opacity:0;pointer-events:none}

/* === NEW: 우산 인터랙션 모듈 === */
#umbrella-module{
  --bg:#0066cc; --fg:#ffffff;
  background:var(--bg); color:var(--fg); transition:background 1s ease;
}
#umbrella-wrap{position:absolute; inset:0}
#umbrella-canvas{position:fixed; inset:0; display:block}
#umbrella-ui{
  position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
  text-align:center; font-size:14px; font-weight:600; color:var(--fg);
  opacity:.95; user-select:none;
}
/* 우산 이미지 렌더(추가) */
#umbrella-img{
  position:fixed; left:0; top:0; width:min(22vw, 220px);
  transform:translate(-50%, -75%);
  pointer-events:none; user-select:none; z-index:1000;
}

@media (max-width:768px){
  .tab-container{top:10px;gap:6px;padding:6px}
  .tab-button{padding:6px 12px;font-size:12px}
  #controls{bottom:10px;left:10px;padding:12px;max-width:calc(100% - 40px)}
  #playground-controls{bottom:10px;flex-direction:column;width:90%}
  #playground-controls>*{width:100%}
}
</style>
</head>
<body>

<div id="home-button" aria-label="홈">
  <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
</div>

<div class="tab-container">
  <button id="text-drawing-tab" class="tab-button active">텍스트 드로잉</button>
  <button id="typography-tab" class="tab-button">인터랙티브 타이포</button>
  <button id="playground-tab" class="tab-button">글자 놀이터</button>
  <button id="umbrella-tab" class="tab-button">우산 인터랙션</button>
</div>

<!-- Text Drawing -->
<div id="text-drawing-module" class="module active">
  <div id="instructions">마우스를 움직이면서 타이핑하세요</div>
  <div id="controls">
    <div class="control-group"><span class="control-label">모드</span>
      <button id="mode-maximal" class="active">맥시멀리즘</button>
      <button id="mode-minimal">미니멀리즘</button>
    </div>
    <div class="separator"></div>
    <div class="control-group"><span class="control-label">글꼴</span>
      <select id="font-select">
        <option value="Pretendard">Pretendard</option>
        <option value="Noto Sans KR">Noto Sans KR</option>
        <option value="Nanum Gothic">나눔고딕</option>
        <option value="Nanum Myeongjo">나눔명조</option>
      </select>
    </div>
    <div class="separator"></div>
    <div class="control-group"><span class="control-label">제어</span>
      <button id="clear-btn">지우기</button>
      <button id="undo-btn">되돌리기</button>
      <button id="redo-btn">다시하기</button>
      <button id="save-btn">저장</button>
    </div>
    <div class="separator"></div>
    <div class="control-group"><span class="control-label">크기</span>
      <button id="font-size-up">A+</button>
      <button id="font-size-down">A-</button>
    </div>
    <div class="separator"></div>
    <div class="control-group"><span class="control-label">색상</span>
      <div style="margin-top:6px;">
        <div class="color-option selected" style="background-color:#000" data-color="#000000"></div>
        <div class="color-option" style="background-color:#666" data-color="#666666"></div>
        <div class="color-option" style="background-color:#999" data-color="#999999"></div>
        <div class="color-option" style="background-color:#e74c3c" data-color="#e74c3c"></div>
        <div class="color-option" style="background-color:#3498db" data-color="#3498db"></div>
        <div class="color-option" style="background-color:#2ecc71" data-color="#2ecc71"></div>
        <div class="color-option" style="background-color:#f39c12" data-color="#f39c12"></div>
        <div class="color-option" style="background-color:#9b59b6" data-color="#9b59b6"></div>
      </div>
    </div>
  </div>
  <canvas id="canvas"></canvas>
</div>

<!-- Typography -->
<div id="typography-module" class="module">
  <div id="container">
    <div id="sentences"></div>
    <div id="cursor"></div>
    <div id="cursor-dot"></div>
    <div class="key-display"></div>
    <div id="typing-area"></div>
    <div class="typing-instruction">문장을 입력하고 Enter를 누르세요</div>
    <input type="text" id="hidden-input" />
  </div>
</div>

<!-- Playground -->
<div id="playground-module" class="module">
  <div id="mode-indicator">드래그 모드</div>
  <div id="help-text">스페이스바: 모드 변경 | 방향키: 강도 조절</div>
  <div id="app">
    <div id="text-container">안녕</div>
    <div id="playground-controls">
      <select id="morphMode">
        <option value="drag">드래그</option>
        <option value="wave">파동</option>
        <option value="twist">비틀기</option>
        <option value="shake">흔들기</option>
        <option value="explode">폭발</option>
        <option value="type">타이핑</option>
      </select>
      <input type="text" id="textInput" placeholder="글자 입력" value="안녕" maxlength="200">
      <select id="pg-font-select">
        <option value="Pretendard">Pretendard</option>
        <option value="Noto Sans KR">Noto Sans KR</option>
        <option value="Nanum Gothic">나눔고딕</option>
        <option value="Nanum Myeongjo">나눔명조</option>
      </select>
      <input type="color" id="color-picker" value="#000000">
    </div>
  </div>
</div>

<!-- NEW: 우산 인터랙션 -->
<div id="umbrella-module" class="module" aria-label="우산 인터랙션">
  <div id="umbrella-wrap">
    <canvas id="umbrella-canvas"></canvas>
    <!-- 시각 우산 이미지(추가) -->
    <img id="umbrella-img" src="image/h.png" alt="umbrella">

    <div id="umbrella-ui">☂️ 비가 내리고, 우산에 닿으면 소리와 함께 튑니다. (모듈 영역 클릭 시 색상 전환)</div>

    <!-- 효과음: audio/ 폴더에 파일 배치 필요 -->
    <audio id="umb-bgRain" src="audio/rain_loop.mp3" loop></audio>
    <audio id="umb-drop1" src="audio/drop1.mp3"></audio>
    <audio id="umb-drop2" src="audio/drop2.mp3"></audio>
    <audio id="umb-bounce1" src="audio/bounce1.mp3"></audio>
    <audio id="umb-bounce2" src="audio/bounce2.mp3"></audio>
  </div>
</div>

<script>
/* ---------------- 공용 탭/모듈 전환 ---------------- */
const modules = {
  textDrawing: document.getElementById('text-drawing-module'),
  typography:  document.getElementById('typography-module'),
  playground:  document.getElementById('playground-module'),
  umbrella:    document.getElementById('umbrella-module')
};
const tabs = {
  textDrawing: document.getElementById('text-drawing-tab'),
  typography:  document.getElementById('typography-tab'),
  playground:  document.getElementById('playground-tab'),
  umbrella:    document.getElementById('umbrella-tab')
};
let activeModule = 'textDrawing';
function switchModule(moduleName){
  Object.keys(modules).forEach(k=>{
    modules[k].classList.remove('active');
    tabs[k].classList.remove('active');
  });
  modules[moduleName].classList.add('active');
  tabs[moduleName].classList.add('active');
  activeModule = moduleName;
  if(moduleName==='textDrawing' && drawingInput){ setTimeout(()=>drawingInput.focus(),100); }
  else if(moduleName==='typography' && typoHiddenInput){ setTimeout(()=>typoHiddenInput.focus(),100); }
}
tabs.textDrawing.addEventListener('click',()=>switchModule('textDrawing'));
tabs.typography .addEventListener('click',()=>switchModule('typography'));
tabs.playground .addEventListener('click',()=>switchModule('playground'));
tabs.umbrella  .addEventListener('click',()=>switchModule('umbrella'));

/* ---------------- Text Drawing (원본) ---------------- */
let drawingInput=null;
(function(){
  const canvas=document.getElementById('canvas');
  const ctx=canvas.getContext('2d');
  let mouseX=0,mouseY=0,smoothMouseX=0,smoothMouseY=0,fontSize=24,textColor='#000',currentFont='Pretendard',currentMode='maximal';
  let mouseTrail=[],drawnChars=[],isComposing=false,composingText='';
  let history=[],historyIndex=-1;const MAX_HISTORY=50;

  function saveState(){if(historyIndex<history.length-1){history=history.slice(0,historyIndex+1)}const state={chars:JSON.parse(JSON.stringify(drawnChars)),trail:JSON.parse(JSON.stringify(mouseTrail))};history.push(state);if(history.length>MAX_HISTORY){history.shift()}else{historyIndex++}}
  function undo(){if(historyIndex>0){historyIndex--;const s=history[historyIndex];drawnChars=JSON.parse(JSON.stringify(s.chars));mouseTrail=JSON.parse(JSON.stringify(s.trail));redrawCanvas()}}
  function redo(){if(historyIndex<history.length-1){historyIndex++;const s=history[historyIndex];drawnChars=JSON.parse(JSON.stringify(s.chars));mouseTrail=JSON.parse(JSON.stringify(s.trail));redrawCanvas()}}

  function resizeCanvas(){
    const tmp=document.createElement('canvas');tmp.width=canvas.width;tmp.height=canvas.height;const tctx=tmp.getContext('2d'); if(canvas.width>0&&canvas.height>0){try{tctx.drawImage(canvas,0,0)}catch(e){}}
    canvas.width=innerWidth;canvas.height=innerHeight; if(tmp.width>0&&tmp.height>0){try{ctx.drawImage(tmp,0,0)}catch(e){}}
    mouseX=canvas.width/2;mouseY=canvas.height/2;smoothMouseX=mouseX;smoothMouseY=mouseY;
  }
  resizeCanvas(); addEventListener('resize',resizeCanvas);
  canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouseX=e.clientX-r.left;mouseY=e.clientY-r.top});
  function updateSmoothMouse(){
    const k=0.25;smoothMouseX+=(mouseX-smoothMouseX)*k;smoothMouseY+=(mouseY-smoothMouseY)*k;
    const minD=3;
    if(mouseTrail.length===0||Math.hypot(smoothMouseX-mouseTrail.at(-1).x,smoothMouseY-mouseTrail.at(-1).y)>minD){
      mouseTrail.push({x:smoothMouseX,y:smoothMouseY,time:Date.now()}); if(mouseTrail.length>800){mouseTrail.shift()}
    }
  }

  drawingInput=document.createElement('input'); drawingInput.type='text'; drawingInput.style.cssText='position:fixed;opacity:0;pointer-events:none;left:-1000px'; document.body.appendChild(drawingInput);
  drawingInput.addEventListener('compositionstart',e=>{if(activeModule!=='textDrawing')return; isComposing=true;composingText=e.data||''});
  drawingInput.addEventListener('compositionupdate',e=>{if(activeModule!=='textDrawing')return; composingText=e.data||''});
  drawingInput.addEventListener('compositionend',e=>{if(activeModule!=='textDrawing')return; isComposing=false; const ch=e.data; if(ch){addCharacter(ch);saveState()}composingText='';drawingInput.value=''});
  drawingInput.addEventListener('input',e=>{if(activeModule!=='textDrawing')return; if(!isComposing&&e.data){addCharacter(e.data);saveState();drawingInput.value=''}});
  drawingInput.addEventListener('keydown',e=>{
    if(activeModule!=='textDrawing')return; if(isComposing)return;
    if(e.key==='Backspace'){ if(drawnChars.length>0){drawnChars.pop();saveState()} return; }
    if(e.key==='Enter'){ drawnChars=[];mouseTrail=[];saveState();return; }
    if(e.key.length===1&&!e.ctrlKey&&!e.altKey&&!e.metaKey){ addCharacter(e.key);saveState(); }
  });
  function addCharacter(char){
    const pos={x:smoothMouseX,y:smoothMouseY}; let angle=0;
    if(mouseTrail.length>1){const a=mouseTrail.at(-1),b=mouseTrail.at(-2); angle=Math.atan2(a.y-b.y,a.x-b.x)}
    drawnChars.push({char,x:pos.x,y:pos.y,angle,scale:1,opacity:.9,birthTime:Date.now(),targetAngle:angle});
  }
  function redrawCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height); drawnChars.forEach(o=>{if(o.opacity<=0)return; ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.angle);ctx.scale(o.scale,o.scale);ctx.font=`${fontSize}px '${currentFont}', sans-serif`;ctx.fillStyle=textColor;ctx.globalAlpha=o.opacity;ctx.fillText(o.char,0,0);ctx.restore();})}
  function animate(){
    updateSmoothMouse(); const time=Date.now()*0.001;
    for(let i=0;i<drawnChars.length;i++){
      const ch=drawnChars[i]; const circleRadius=15+(i%10)*3; const circleSpeed=0.8+(i%7)*0.2; const phase=i*0.8;
      const orbitalX=Math.cos(time*circleSpeed+phase)*circleRadius; const orbitalY=Math.sin(time*circleSpeed+phase)*circleRadius;
      const prog=i/Math.max(drawnChars.length-1,1); const ti=Math.floor(prog*Math.max(mouseTrail.length-1,0));
      if(ti>=0 && ti<mouseTrail.length){
        const target=mouseTrail[ti]; const floatX=Math.sin(time*1.5+i*1.2)*12; const floatY=Math.cos(time*1.8+i*0.9)*12;
        const waveX=Math.sin(time*2+i*0.5)*8; const waveY=Math.cos(time*2.5+i*0.7)*8;
        const tx=target.x+orbitalX+floatX+waveX; const ty=target.y+orbitalY+floatY+waveY;
        const k=0.08+Math.sin(time+i)*0.02; ch.x+= (tx-ch.x)*k; ch.y+= (ty-ch.y)*k;
        const rotSpeed=0.5+(i%5)*0.3; const baseR=time*rotSpeed+i*2;
        if(ti>0 && ti<mouseTrail.length-1){const p=mouseTrail[ti-1],n=mouseTrail[Math.min(ti+1,mouseTrail.length-1)]; const pathAngle=Math.atan2(n.y-p.y,n.x-p.x);
          const targ=pathAngle+Math.sin(baseR)*0.5; let d=targ-ch.angle; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; ch.angle+=d*0.1;
        }else{ ch.angle+=0.02*rotSpeed; }
        const sf=1.5+(i%6)*0.5; ch.scale = 1 + Math.sin(time*sf+i*1.5)*0.08;
        const opw=Math.sin(time*2+i*0.6)*0.1; const base=0.85+opw; const maxAge=30000; const ageMs=Date.now()-ch.birthTime;
        ch.opacity = ageMs>maxAge ? Math.max(0, base - (ageMs-maxAge)/10000) : base;
      }
    }
    redrawCanvas();
    if(currentMode==='maximal' && composingText){
      const fx=Math.sin(time*3)*5, fy=Math.cos(time*2.5)*5, rot=Math.sin(time*1.5)*0.1;
      ctx.save(); ctx.translate(smoothMouseX+fx,smoothMouseY+fy); ctx.rotate(rot);
      ctx.font=`${fontSize}px '${currentFont}', sans-serif`; ctx.fillStyle='rgba(0,0,0,.5)'; ctx.globalAlpha = Math.sin(time*3)*0.15 + 0.85; ctx.fillText(composingText,0,0); ctx.restore();
    }
    drawnChars = drawnChars.filter(ch=>ch.opacity>0);
    requestAnimationFrame(animate);
  }
  animate();

  document.getElementById('mode-maximal').addEventListener('click',()=>{currentMode='maximal';document.getElementById('mode-maximal').classList.add('active');document.getElementById('mode-minimal').classList.remove('active');drawingInput.focus()});
  document.getElementById('mode-minimal').addEventListener('click',()=>{currentMode='minimal';document.getElementById('mode-minimal').classList.add('active');document.getElementById('mode-maximal').classList.remove('active')});
  document.getElementById('font-select').addEventListener('change',e=>currentFont=e.target.value);
  document.getElementById('font-size-up').addEventListener('click',()=>{fontSize=Math.min(fontSize+4,72)});
  document.getElementById('font-size-down').addEventListener('click',()=>{fontSize=Math.max(fontSize-4,12)});
  document.querySelectorAll('#controls .color-option').forEach(opt=>{
    opt.addEventListener('click',function(){document.querySelector('#controls .color-option.selected').classList.remove('selected');this.classList.add('selected');textColor=this.getAttribute('data-color')})
  });
  document.getElementById('clear-btn').addEventListener('click',()=>{const link=document.createElement('a');link.download='typography-art.png';link.href=canvas.toDataURL();link.click()});
  document.getElementById('undo-btn').addEventListener('click',undo);
  document.getElementById('redo-btn').addEventListener('click',redo);
  document.getElementById('save-btn').addEventListener('click',()=>{const link=document.createElement('a');link.download='typography-art.png';link.href=canvas.toDataURL();link.click()});
  canvas.addEventListener('click',()=>{if(activeModule==='textDrawing'){drawingInput.focus()}});
  saveState();
})();

/* ---------------- Typography (원본) ---------------- */
let typoHiddenInput=null;
(function(){
  const container=document.getElementById('container');
  const sentencesContainer=document.getElementById('sentences');
  const cursor=document.getElementById('cursor');
  const cursorDot=document.getElementById('cursor-dot');
  const typingArea=document.getElementById('typing-area');
  typoHiddenInput=document.getElementById('hidden-input');
  let mouseX=0,mouseY=0,typedText='',activeSentenceIndex=null;

  const initialSentences=[
    "단어들이 춤추는 디지털 공간에, 오신 것을 환영합니다",
    "마우스를 클릭해 단어들과 상호작용해 보세요",
    "클릭 한 번에 단어가 파동처럼 퍼져나갑니다",
    "입력해보세요, 오직 당신만의 문장이 생성됩니다",
    "타이포그래피는 소리 없는 목소리입니다",
    "글자는 시간과 공간을 담는 그릇입니다",
    "언어는 우리의 가장 오래된 인터페이스입니다",
    "생각이 말로 흐르고, 말이 글로 영속됩니다",
    "간결함 속에 담긴 깊은 의미를 찾아보세요",
    "글자가 문장을 엮고, 문장이 이야기를 만듭니다"
  ];
  function createSentence(text){
    const el=document.createElement('div'); el.className='sentence';
    const words=text.split(' ');
    words.forEach((w,i)=>{
      const we=document.createElement('span'); we.className='word'; we.textContent=w;
      we.addEventListener('mouseover',()=>{ if(activeModule!=='typography')return; we.classList.add('active'); const sib=[...we.parentNode.children]; const idx=sib.indexOf(we); sib.forEach((s,j)=>{if(Math.abs(j-idx)<=2&&s!==we){s.style.transform='scale(1.05) translateY(-2px)';s.style.opacity='0.7';}}); });
      we.addEventListener('mouseout',()=>{ if(activeModule!=='typography')return; we.classList.remove('active'); [...we.parentNode.children].forEach(s=>{s.style.transform='';s.style.opacity='';}); });
      we.addEventListener('click',e=>{ if(activeModule!=='typography')return; e.stopPropagation(); explodeWord(we); });
      el.appendChild(we); if(i<words.length-1) el.appendChild(document.createTextNode(' '));
    });
    if(sentencesContainer.firstChild) sentencesContainer.insertBefore(el,sentencesContainer.firstChild);
    else sentencesContainer.appendChild(el);
    el.style.opacity='0'; el.style.transform='translateY(-20px)';
    setTimeout(()=>{ el.style.transition='all .5s ease'; el.style.opacity='.25'; el.style.transform='translateY(0)'; },100);
    setTimeout(()=>sentencesContainer.scrollTop=0,100);
  }
  function explodeWord(wordEl){
    if(activeModule!=='typography')return;
    const r=wordEl.getBoundingClientRect(); const cx=r.left+r.width/2; const cy=r.top+r.height/2; const text=wordEl.textContent;
    for(let i=0;i<text.length;i++){ setTimeout(()=>{ createFloatingLetter(text[i],cx,cy); }, i*80); }
    wordEl.style.transform='scale(1.3) rotate(2deg)'; wordEl.style.opacity='1'; wordEl.style.fontWeight='500';
    setTimeout(()=>{ wordEl.style.transform=''; wordEl.style.opacity=''; wordEl.style.fontWeight=''; },800);
  }
  function createFloatingLetter(letter,x,y){
    if(activeModule!=='typography')return;
    const e=document.createElement('div'); e.className='letter'; e.textContent=letter;
    const ox=(Math.random()-0.5)*80, oy=(Math.random()-0.5)*80;
    e.style.left=`${x+ox}px`; e.style.top=`${y+oy}px`; e.style.fontSize=`${20+Math.random()*25}px`; e.style.fontWeight=Math.random()>0.5?'300':'500';
    container.appendChild(e); setTimeout(()=>{ if(e.parentNode===container) container.removeChild(e); },1500);
  }
  function createWave(x,y){
    if(activeModule!=='typography')return;
    const w=document.createElement('div'); w.className='wave'; w.style.left=`${x}px`; w.style.top=`${y}px`; container.appendChild(w);
    setTimeout(()=>{ if(w.parentNode===container) container.removeChild(w); },1500);
  }
  document.addEventListener('mousemove',e=>{
    if(activeModule!=='typography')return;
    mouseX=e.clientX; mouseY=e.clientY; cursor.style.left=mouseX+'px'; cursor.style.top=mouseY+'px'; cursorDot.style.left=mouseX+'px'; cursorDot.style.top=mouseY+'px';
    const sList=document.querySelectorAll('.sentence'); let best=Infinity, idx=null;
    sList.forEach((s,i)=>{const r=s.getBoundingClientRect(); const cy=r.top+r.height/2; const d=Math.abs(mouseY-cy); if(d<best){best=d; idx=i;}});
    if(idx!==null && idx!==activeSentenceIndex){ sList.forEach(s=>s.classList.remove('focused')); sList[idx].classList.add('focused'); activeSentenceIndex=idx; }
  });
  modules.typography.addEventListener('click',e=>{ if(activeModule!=='typography')return; createWave(e.clientX,e.clientY); typoHiddenInput.focus(); });
  typoHiddenInput.addEventListener('input',()=>{ if(activeModule!=='typography')return; typedText=typoHiddenInput.value; typingArea.textContent=typedText; typingArea.style.opacity=typedText?'1':'0';
    if(typedText.length>0){ const last=typedText.at(-1); createFloatingLetter(last, Math.random()*innerWidth, Math.random()*innerHeight); }
  });
  typoHiddenInput.addEventListener('keydown',e=>{ if(activeModule!=='typography')return; if(e.key==='Enter' && typedText.trim()!==''){ createSentence(typedText); typedText=''; typoHiddenInput.value=''; typingArea.textContent=''; typingArea.style.opacity='0'; e.preventDefault(); }});
  initialSentences.forEach(createSentence);
})();

/* ---------------- NEW: 우산 인터랙션 ---------------- */
(function(){
  const moduleEl = document.getElementById('umbrella-module');
  const wrap     = document.getElementById('umbrella-wrap');
  const c        = document.getElementById('umbrella-canvas');
  const g        = c.getContext('2d',{alpha:true});
  const umbrellaImg = document.getElementById('umbrella-img');

  // DPR/리사이즈
  const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  let W=0,H=0;
  function resize(){
    W = c.width  = Math.floor(innerWidth * DPR);
    H = c.height = Math.floor(innerHeight* DPR);
    c.style.width  = innerWidth  + 'px';
    c.style.height = innerHeight + 'px';
    g.setTransform(DPR,0,0,DPR,0,0);
  }
  addEventListener('resize', resize, {passive:true}); resize();

  // 배경색 전환
  const colors = ["#0066cc","#222","#0044aa","#005577","#8800cc","#008855","#cc6600","#990000"];
  let colorIndex = 0;
  wrap.addEventListener('click', ()=>{
    if(activeModule!=='umbrella') return;
    colorIndex = (colorIndex + 1) % colors.length;
    moduleEl.style.background = colors[colorIndex];
  });

  // ------ 사운드 ------
  const bgRain  = document.getElementById('umb-bgRain');
  const drop1   = document.getElementById('umb-drop1');
  const drop2   = document.getElementById('umb-drop2');
  const bounce1 = document.getElementById('umb-bounce1');
  const bounce2 = document.getElementById('umb-bounce2');
  bgRain.volume = 0.25;
  const dropSounds   = [drop1, drop2];
  const bounceSounds = [bounce1, bounce2];

  const startAudio = ()=>{ if(activeModule!=='umbrella') return; bgRain.play().catch(()=>{}); };
  wrap.addEventListener('click', startAudio, {once:true});

  function playSound(arr, vol=1){
    const s = arr[(Math.random()*arr.length)|0].cloneNode();
    s.volume = vol;
    s.play();
  }

  // 물리/파티클
  const JAMO = "ㄱ ㄴ ㄷ ㄹ ㅁ ㅂ ㅅ ㅇ ㅈ ㅊ ㅋ ㅌ ㅍ ㅎ ㅏ ㅓ ㅗ ㅜ ㅡ ㅣ".split(" ");
  const choice = a => a[(Math.random()*a.length)|0];
  const rand   = (a,b)=> a + Math.random()*(b-a);

  const BASE_G = 0.03, MAX = 320, FONT = 34, AIR_BASE = 0.996, UMB_MIN_UP = 3.0, UMB_UP_GAIN = 0.5, UMB_SIDE_KICK = 0.55;

  const umbrella = { x: innerWidth/2, y: innerHeight/3, r: Math.min(innerWidth,innerHeight)*0.12,
    follow(x,y){ this.x=x; this.y=y; }
  };

  // 마우스/터치 추적 (모듈 한정)
  wrap.addEventListener('mousemove', e=>{
    if(activeModule!=='umbrella') return;
    umbrella.follow(e.clientX, e.clientY);
  }, {passive:true});
  wrap.addEventListener('touchmove', e=>{
    if(activeModule!=='umbrella') return;
    const t=e.touches[0]; umbrella.follow(t.clientX, t.clientY);
  }, {passive:true});

  // 이밋터
  const emitters = []; const EMITTER_COUNT = 7;
  for(let i=0;i<EMITTER_COUNT;i++){
    const x0 = (i+0.5)/EMITTER_COUNT * innerWidth;
    emitters.push({
      xMin: Math.max(0, x0 - innerWidth*(0.5/EMITTER_COUNT)),
      xMax: Math.min(innerWidth, x0 + innerWidth*(0.5/EMITTER_COUNT)),
      rate: 4.5 + Math.random()*3.0,
      nextAt: 0
    });
  }
  const expInterval = rate => -Math.log(1-Math.random()) / rate;

  const particles = [];
  let simTime = 0;

  // 우산 외곽선 표시 여부 (요청: 선/곡선 제거)
  const SHOW_UMBRELLA_OUTLINE = false;

  class P{
    constructor(){ this.reset(true); }
    reset(fresh=false){
      this.char = choice(JAMO);
      this.size = FONT + rand(-3,3);
      this.x = rand(0, innerWidth);
      this.y = fresh ? rand(-H*0.8, H*0.6) : -20;
      this.vx = rand(-0.25, 0.25);
      this.vy = rand(0.4, 1.5);
      this.spin = rand(-0.02, 0.02);
      this.rot  = rand(-Math.PI, Math.PI);
      this.g    = BASE_G * rand(0.85, 1.15);
      this.drag = AIR_BASE * rand(0.993, 0.999);
      this.seed = Math.random()*1000;
      this.active = true;
      this.respawnAt = 0;
    }
    scheduleRespawn(delay){
      this.active = false;
      this.respawnAt = simTime + delay;
      this.xNext = rand(0, innerWidth);
      this.vxNext = rand(-0.25, 0.25);
      this.vyNext = rand(0.5, 1.4);
    }
    maybeRespawn(){
      if(!this.active && simTime >= this.respawnAt){
        this.active = true;
        this.x = this.xNext; this.y = -20;
        this.vx = this.vxNext; this.vy = this.vyNext;
        this.g = BASE_G * rand(0.85, 1.15);
        this.drag = AIR_BASE * rand(0.993, 0.999);
        this.seed = Math.random()*1000;
        playSound(dropSounds, 0.12);
      }
    }
    step(t){
      if(!this.active){ this.maybeRespawn(); return; }
      const wind = Math.sin(t*1.35 + this.seed*2.11)*0.016 + Math.cos(t*0.72 + this.seed*5.29)*0.011;
      this.vx += wind;
      this.vy += this.g;
      this.vx *= this.drag; this.vy *= this.drag;
      this.x  += this.vx;   this.y  += this.vy;
      this.rot+= this.spin;

      const dx=this.x-umbrella.x, dy=this.y-umbrella.y, dist=Math.hypot(dx,dy), R=umbrella.r;
      if(dist<R){
        const nx=dx/(dist||1), ny=dy/(dist||1);
        const dot=this.vx*nx + this.vy*ny;
        this.vx -= 2*dot*nx; this.vy -= 2*dot*ny;
        const up = Math.max(UMB_MIN_UP, Math.abs(dot)*UMB_MIN_UP*UMB_UP_GAIN + UMB_MIN_UP);
        this.vy = -up;
        this.vx += (Math.random()-0.5)*UMB_SIDE_KICK;
        const push = R - dist + 0.8; this.x += nx*push; this.y += ny*push;
        playSound(bounceSounds, 0.25);
      }
      if(this.y<-60 || this.y>innerHeight+100){ this.scheduleRespawn(rand(0.05,0.6)); return; }
    }
    draw(){
      if(!this.active) return;
      g.save();
      g.translate(this.x,this.y); g.rotate(this.rot);
      g.font = `${this.size}px Pretendard`; g.fontWeight='700'; g.textAlign='center'; g.textBaseline='alphabetic'; g.fillStyle='white';
      g.fillText(this.char, 0, 0);
      g.restore();
    }
  }
  for(let i=0;i<160;i++) particles.push(new P(true));

  function drawUmbrella(){
    if(!SHOW_UMBRELLA_OUTLINE) return; // 요청에 따라 윤곽선 감춤
    const {x,y,r}=umbrella;
    g.save(); g.lineWidth=1.2; g.strokeStyle='rgba(255,255,255,.9)';
    g.beginPath(); g.arc(x,y,r,Math.PI,0,false); g.stroke();
    g.beginPath(); g.moveTo(x,y); g.lineTo(x,y+r*0.9);
    g.arc(x-r*0.22,y+r*0.9,r*0.22,1.5*Math.PI,0.3*Math.PI,true); g.stroke(); g.restore();
  }

  // 이미지 위치를 우산 좌표에 동기화
  function syncUmbrellaImage(){
    if(activeModule!=='umbrella') { requestAnimationFrame(syncUmbrellaImage); return; }
    umbrellaImg.style.left = umbrella.x + 'px';
    umbrellaImg.style.top  = umbrella.y + 'px';
    requestAnimationFrame(syncUmbrellaImage);
  }
  requestAnimationFrame(syncUmbrellaImage);

  let last=performance.now();
  function frame(now){
    if(activeModule!=='umbrella'){ last=now; requestAnimationFrame(frame); return; }
    const dt=Math.min(0.05,(now-last)/1000); last=now; simTime+=dt;

    g.clearRect(0,0,innerWidth,innerHeight);
    drawUmbrella(); // 호출은 유지하되 내부에서 바로 return되어 선/곡선 미표시

    for(const em of emitters){
      while(simTime>=em.nextAt && particles.length<MAX){
        const p=new P(false); p.x=rand(em.xMin,em.xMax); p.y=-20; particles.push(p); em.nextAt+=expInterval(em.rate);
      }
    }
    const t=simTime;
    for(let i=0;i<particles.length;i++){ particles[i].step(t); particles[i].draw(); }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* 홈 버튼 이동 */
document.getElementById('home-button').addEventListener('click',e=>{
  e.preventDefault(); window.location.href='index.html#list-section';
});
</script>
