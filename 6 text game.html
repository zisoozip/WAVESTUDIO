<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>타이포그래피 놀이</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Pretendard:wght@300;400;500;700;900&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{height:-webkit-fill-available}
body{
  font-family:"Pretendard","Noto Sans KR",sans-serif;background-color:#fff;color:#000;
  height:100vh;min-height:100vh;min-height:-webkit-fill-available;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* 홈 버튼 (Pretendard 화살표) */
#home-button{position:fixed;left:20px;top:20px;z-index:2001;background:transparent;border:none;cursor:pointer;height:28px;display:flex;align-items:center}
#home-button .icon-leftarrow{font-family:"Pretendard","Noto Sans KR",sans-serif;font-size:20px;font-weight:400;line-height:1;color:#111}

/* 탭 */
.tab-container{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  display:flex;gap:8px;z-index:1000;padding:8px 10px;background:rgba(255,255,255,.95);
  border:1px solid #e8e9ea;border-radius:24px;backdrop-filter:blur(10px);box-shadow:0 2px 12px rgba(0,0,0,.08)
}
.tab-button{padding:8px 16px;border:1px solid #e8e9ea;background:#fff;border-radius:20px;cursor:pointer;transition:all .2s ease;color:#666;font-size:13px}
.tab-button:hover{background:#f8f9fa;border-color:#ddd;color:#333}
.tab-button.active{background:#000;color:#fff;border-color:#000}

.module{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .3s ease}
.module.active{opacity:1;pointer-events:auto}

/* Text Drawing */
#text-drawing-module{background:#fff;cursor:crosshair}
#canvas{position:absolute;inset:0;width:100%;height:100%}

/* 제어센터 */
#controls{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.95);border:1px solid #e8e9ea;
  padding:12px 14px;border-radius:12px;z-index:1000;backdrop-filter:blur(10px);
  box-shadow:0 4px 16px rgba(0,0,0,.08);display:flex;gap:10px;align-items:center;flex-wrap:wrap
}
.control-chip{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid #e8e9ea;border-radius:12px;background:#fff}
.control-chip label{font-size:12px;color:#666}
input[type="color"]{width:32px;height:28px;border:1px solid #e8e9ea;border-radius:6px;background:#fff;cursor:pointer}
#controls button{padding:8px 14px;cursor:pointer;border:1px solid #e8e9ea;border-radius:20px;background:#fff;color:#666;font-size:12px;transition:all .2s ease}
#controls button:hover{background:#f8f9fa;color:#333;border-color:#ddd}
.size-chip{display:flex;align-items:center;gap:6px}
.size-chip .size-val{min-width:44px;text-align:center;font-size:12px;color:#666}

#instructions{
  position:fixed;top:84px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);border:1px solid #e8e9ea;
  padding:10px 16px;border-radius:16px;text-align:center;font-size:13px;z-index:1000;color:#666;backdrop-filter:blur(10px);box-shadow:0 2px 8px rgba(0,0,0,.08)
}

/* Playground — 중앙 정렬 보증 */
#playground-module{
  display:flex;
  justify-content:center;
  align-items:center;
  background:#fff;
}
#app{
  width:100vw; max-width:100vw; padding:20px;
  height:100vh;
  display:flex; justify-content:center; align-items:center;
  text-align:center; user-select:none; position:relative;
}
#text-container{
  display:inline-block; margin:0 auto;
  width:auto; max-width:min(90vw,1400px);
  font-size:clamp(40px, 7.2vw, 120px);
  line-height:1.12;
  letter-spacing:-0.3px;
  font-weight:300; color:#000; cursor:grab; transition:transform .3s ease;
  white-space:normal; word-break:keep-all; padding:0 12px; text-align:center;
  transform-origin:center center;
}
@media (max-width: 768px){
  #text-container{ font-size:clamp(28px, 8.6vw, 96px); line-height:1.15; }
}
#text-container:hover{transform:scale(1.01)}
#text-container:active{cursor:grabbing}
.line{display:block;text-align:center}
#playground-controls{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);border:1px solid #e8e9ea;padding:12px 20px;border-radius:20px;display:flex;gap:12px;align-items:center;z-index:100;
  backdrop-filter:blur(10px);box-shadow:0 4px 16px rgba(0,0,0,.08);flex-wrap:wrap;max-width:90%
}
#playground-controls select,#textInput{padding:8px 12px;border:1px solid #e8e9ea;border-radius:8px;font-size:13px;background:#fff;color:#666}
#color-picker{width:36px;height:32px;border:1px solid #e8e9ea;border-radius:6px;background:#fff}
#mode-indicator{
  position:fixed;top:84px;left:50%;transform:translateX(-50%);color:#666;padding:8px 16px;font-size:13px;background:rgba(255,255,255,.95);border:1px solid #e8e9ea;border-radius:20px;backdrop-filter:blur(10px);box-shadow:0 2px 8px rgba(0,0,0,.08)
}
#help-text{
  position:fixed;bottom:88px;left:50%;transform:translateX(-50%);color:#666;padding:8px 16px;border-radius:16px;font-size:12px;opacity:.7;background:rgba(255,255,255,.95);border:1px solid #e8e9ea;backdrop-filter:blur(10px);box-shadow:0 2px 8px rgba(0,0,0,.06)
}

/* Typography */
#typography-module{display:flex;justify-content:center;align-items:center;background:#fff;cursor:none}
#container{width:100%;height:100%;position:relative}
#sentences{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding:10vh 5vw 5vh;overflow-y:auto}
#sentences::-webkit-scrollbar{display:none}
.sentence{width:100%;text-align:center;font-weight:300;font-size:3vh;line-height:1.8;opacity:.25;transition:all .3s ease;white-space:normal;padding:0 15%;color:#000000}
.sentence.headline{color:#000000;font-weight:500;filter:none;transform:none}
.word{display:inline-block;position:relative;margin:0 .5vw;transition:all .3s ease}
.word.active{transform:scale(1.2);font-weight:500;opacity:1}
.word:hover{transform:scale(1.05) translateY(-2px);opacity:.7}
.focused{opacity:.8}
#cursor{position:absolute;width:12px;height:12px;border-radius:50%;background:transparent;border:1px solid #666;pointer-events:none;transform:translate(-50%,-50%);z-index:1000}
#cursor-dot{position:absolute;width:3px;height:3px;border-radius:50%;background:#666;pointer-events:none;transform:translate(-50%,-50%);z-index:1001}
.letter{position:absolute;font-weight:300;pointer-events:none;transform-origin:center;opacity:0;animation:letterFloat 1.5s ease-out forwards}
@keyframes letterFloat{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-150px) scale(.5);opacity:0}}
.key-display{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:15vh;font-weight:200;opacity:0}
.wave{position:absolute;border:1px solid #666;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;animation:waveExpand 1.5s ease-out forwards}
@keyframes waveExpand{0%{width:0;height:0;opacity:.4}100%{width:500px;height:500px;opacity:0}}

/* 타이핑 영역 — 처음부터 보이기 + 플레이스홀더 */
#typing-area{
  position:fixed;width:80%;max-width:1000px;text-align:center;bottom:120px;left:50%;transform:translateX(-50%);font-size:24px;font-weight:300;z-index:10;opacity:1;
  padding:16px;border-radius:20px;line-height:1.5;color:#000;background:rgba(255,255,255,.95);border:1px solid #e8e9ea;backdrop-filter:blur(10px);min-height:2.6em
}
#typing-area:empty::before{content:"여기에 글자를 입력하고 Enter를 누르세요"; color:#999}
.typing-instruction{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);opacity:.6;font-size:13px;text-align:center}
#hidden-input{position:fixed;opacity:0;pointer-events:none}

/* 우산 */
#umbrella-module{--bg:#0066cc; --fg:#ffffff; background:var(--bg); color:var(--fg); transition:background 1s ease;}
#umbrella-wrap{position:absolute; inset:0}
#umbrella-canvas{position:fixed; inset:0; display:block}
#umbrella-ui{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); text-align:center; font-size:14px; font-weight:600; color:var(--fg); opacity:.95}
#umbrella-img{position:fixed; left:50%; top:35%; transform:translate(-50%,-50%); width:min(28vw, 360px); max-width:480px; pointer-events:none}

@media (max-width:768px){
  .tab-container{top:10px;gap:6px;padding:6px}
  .tab-button{padding:6px 12px;font-size:12px}
  #controls{bottom:10px;padding:10px}
  #playground-controls{bottom:10px;flex-direction:column;width:90%}
  #playground-controls>*{width:100%}
  #umbrella-img{width:min(44vw, 280px);top:32%}
}
</style>
</head>
<body>

<!-- 홈 버튼 -->
<div id="home-button" aria-label="뒤로">
  <span class="icon-leftarrow" aria-hidden="true">←</span>
</div>

<div class="tab-container">
  <button id="text-drawing-tab" class="tab-button active">텍스트 드로잉</button>
  <button id="typography-tab" class="tab-button">인터랙티브 타이포</button>
  <button id="playground-tab" class="tab-button">글자 놀이터</button>
  <button id="umbrella-tab" class="tab-button">우산 인터랙션</button>
</div>

<!-- Text Drawing -->
<div id="text-drawing-module" class="module active">
  <div id="instructions">마우스를 움직이며 타이핑하세요 — 맥시멀리즘 모드</div>
  <div id="controls" aria-label="제어센터">
    <div class="control-chip"><label for="txt-color">텍스트</label><input type="color" id="txt-color" value="#000000"></div>
    <div class="control-chip"><label for="bg-color">배경</label><input type="color" id="bg-color" value="#ffffff"></div>
    <div class="control-chip size-chip">
      <button id="font-size-down" type="button">A-</button>
      <span class="size-val" id="size-val">24px</span>
      <button id="font-size-up" type="button">A+</button>
    </div>
    <button id="clear-btn" type="button">지우기</button>
    <button id="save-btn"  type="button">저장</button>
  </div>
  <canvas id="canvas"></canvas>
</div>

<!-- Typography -->
<div id="typography-module" class="module">
  <div id="container">
    <div id="sentences"></div>
    <div id="cursor"></div>
    <div id="cursor-dot"></div>
    <div class="key-display"></div>
    <div id="typing-area"></div>
    <div class="typing-instruction">문장을 입력하고 Enter를 누르세요</div>
    <input type="text" id="hidden-input" />
  </div>
</div>

<!-- Playground -->
<div id="playground-module" class="module">
  <div id="mode-indicator">드래그 모드</div>
  <div id="help-text">스페이스바: 모드 변경 | 방향키: 강도 조절</div>
  <div id="app">
    <div id="text-container">안녕</div>
    <div id="playground-controls">
      <select id="morphMode">
        <option value="drag">드래그</option>
        <option value="wave">파동</option>
        <option value="twist">비틀기</option>
        <option value="shake">흔들기</option>
        <option value="explode">폭발</option>
        <option value="type">타이핑</option>
      </select>
      <input type="text" id="textInput" placeholder="글자 입력" value="안녕" maxlength="200">
      <select id="pg-font-select">
        <option value="Pretendard">Pretendard</option>
        <option value="Noto Sans KR">Noto Sans KR</option>
        <option value="Nanum Gothic">나눔고딕</option>
        <option value="Nanum Myeongjo">나눔명조</option>
      </select>
      <input type="color" id="color-picker" value="#000000">
    </div>
  </div>
</div>

<!-- 우산 인터랙션 -->
<div id="umbrella-module" class="module" aria-label="글자가 내리는 하늘">
  <div id="umbrella-wrap">
    <canvas id="umbrella-canvas"></canvas>
    <img id="umbrella-img" src="image/h.png" alt="Umbrella">
    <div id="umbrella-ui">마우스를 이용해 하늘에서 내리는 글자를 만져보세요</div>
    <audio id="umb-bgRain" src="audio/rain_loop.mp3" loop></audio>
    <audio id="umb-drop1" src="audio/drop1.mp3"></audio>
    <audio id="umb-drop2" src="audio/drop2.mp3"></audio>
    <audio id="umb-bounce1" src="audio/bounce1.mp3"></audio>
    <audio id="umb-bounce2" src="audio/bounce2.mp3"></audio>
  </div>
</div>

<script>
/* 유틸 */
function byId(id){return document.getElementById(id)}
function last(a){return a.length?a[a.length-1]:undefined}

/* 모듈 전환 */
const modules={textDrawing:byId('text-drawing-module'),typography:byId('typography-module'),playground:byId('playground-module'),umbrella:byId('umbrella-module')};
const tabs={textDrawing:byId('text-drawing-tab'),typography:byId('typography-tab'),playground:byId('playground-tab'),umbrella:byId('umbrella-tab')};
let activeModule='textDrawing';
function switchModule(m){Object.keys(modules).forEach(k=>{modules[k].classList.remove('active');tabs[k].classList.remove('active')});modules[m].classList.add('active');tabs[m].classList.add('active');activeModule=m;if(m==='textDrawing'&&drawingInput){setTimeout(()=>drawingInput.focus(),100)} if(m==='typography'){setTimeout(()=>byId('hidden-input').focus(),100);}}
tabs.textDrawing.addEventListener('click',()=>switchModule('textDrawing'));
tabs.typography .addEventListener('click',()=>switchModule('typography'));
tabs.playground .addEventListener('click',()=>switchModule('playground'));
tabs.umbrella  .addEventListener('click',()=>switchModule('umbrella'));

/* Text Drawing */
let drawingInput=null;
(function(){
  const canvas=byId('canvas'); const ctx=canvas.getContext('2d');
  let mouseX=0,mouseY=0,sx=0,sy=0,fontSize=24,textColor='#000',bgColor='#fff',currentFont='Pretendard';
  let trail=[],chars=[],isComposing=false,comp='';

  function resize(){
    const tmp=document.createElement('canvas'); tmp.width=canvas.width; tmp.height=canvas.height;
    const tctx=tmp.getContext('2d'); if(canvas.width&&canvas.height){try{tctx.drawImage(canvas,0,0)}catch(e){}}
    canvas.width=innerWidth; canvas.height=innerHeight;
    ctx.fillStyle=bgColor; ctx.fillRect(0,0,canvas.width,canvas.height);
    if(tmp.width&&tmp.height){try{ctx.drawImage(tmp,0,0)}catch(e){}}
    mouseX=canvas.width/2; mouseY=canvas.height/2; sx=mouseX; sy=mouseY;
  }
  resize(); addEventListener('resize',resize);

  canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouseX=e.clientX-r.left;mouseY=e.clientY-r.top});
  function smooth(){const k=.25; sx+=(mouseX-sx)*k; sy+=(mouseY-sy)*k; const p=last(trail); if(!p||Math.hypot(sx-p.x,sy-p.y)>3){trail.push({x:sx,y:sy,t:Date.now()}); if(trail.length>800)trail.shift();}}

  drawingInput=document.createElement('input'); drawingInput.type='text'; drawingInput.style.cssText='position:fixed;opacity:0;pointer-events:none;left:-1000px'; document.body.appendChild(drawingInput);
  drawingInput.addEventListener('compositionstart',()=>{if(activeModule!=='textDrawing')return;isComposing=true});
  drawingInput.addEventListener('compositionupdate',e=>{if(activeModule!=='textDrawing')return;comp=e.data||''});
  drawingInput.addEventListener('compositionend',e=>{if(activeModule!=='textDrawing')return;isComposing=false;const ch=e.data;if(ch){addChar(ch)}comp='';drawingInput.value=''});
  drawingInput.addEventListener('input',e=>{if(activeModule!=='textDrawing')return;if(!isComposing&&e.data){addChar(e.data);drawingInput.value=''}});
  drawingInput.addEventListener('keydown',e=>{if(activeModule!=='textDrawing')return;if(isComposing)return;if(e.key==='Enter'){chars=[];trail=[];draw();return;} if(e.key.length===1&&!e.ctrlKey&&!e.altKey&&!e.metaKey){addChar(e.key)}});

  function addChar(ch){let ang=0;if(trail.length>1){const a=trail[trail.length-1],b=trail[trail.length-2];ang=Math.atan2(a.y-b.y,a.x-b.x)} chars.push({char:ch,x:sx,y:sy,angle:ang,scale:1,opacity:.9,b:Date.now(),color:textColor,size:fontSize,font:currentFont});}

  function draw(){
    ctx.fillStyle=bgColor; ctx.fillRect(0,0,canvas.width,canvas.height);
    for(const o of chars){if(o.opacity<=0)continue;ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.angle);ctx.scale(o.scale,o.scale);ctx.font=`${o.size}px '${o.font}',sans-serif`;ctx.fillStyle=o.color;ctx.globalAlpha=o.opacity;ctx.fillText(o.char,0,0);ctx.restore();}
    if(comp){const t=Date.now()*0.001;const fx=Math.sin(t*3)*5,fy=Math.cos(t*2.5)*5,rot=Math.sin(t*1.5)*.1;ctx.save();ctx.translate(sx+fx,sy+fy);ctx.rotate(rot);ctx.font=`${fontSize}px '${currentFont}',sans-serif`;ctx.fillStyle=textColor;ctx.globalAlpha=.35;ctx.fillText(comp,0,0);ctx.restore();}
  }

  (function loop(){
    smooth(); const time=Date.now()*0.001;
    for(let i=0;i<chars.length;i++){
      const o=chars[i],r=15+(i%10)*3,s=.8+(i%7)*.2,p=i*.8,ox=Math.cos(time*s+p)*r,oy=Math.sin(time*s+p)*r;
      const prog=i/Math.max(chars.length-1,1), ti=Math.floor(prog*Math.max(trail.length-1,0));
      if(ti>=0&&ti<trail.length){
        const tgt=trail[ti],fx=Math.sin(time*1.5+i*1.2)*12,fy=Math.cos(time*1.8+i*.9)*12,wx=Math.sin(time*2+i*.5)*8,wy=Math.cos(time*2.5+i*.7)*8;
        const tx=tgt.x+ox+fx+wx,ty=tgt.y+oy+fy+wy,k=.08+Math.sin(time+i)*.02;o.x+=(tx-o.x)*k;o.y+=(ty-o.y)*k;o.angle+=.02*(.5+(i%5)*.3);o.scale=1+Math.sin(time*(1.5+(i%6)*.5)+i*1.5)*.08;const base=.85+Math.sin(time*2+i*.6)*.1;const age=Date.now()-o.b;o.opacity=age>30000?Math.max(0,base-(age-30000)/10000):base;
      }
    }
    draw(); chars=chars.filter(c=>c.opacity>0); requestAnimationFrame(loop);
  })();

  /* 즉시 반영: 색/배경/크기 */
  byId('txt-color').addEventListener('input',e=>{textColor=e.target.value||'#000'; for(const o of chars)o.color=textColor; draw();});
  byId('bg-color').addEventListener('input',e=>{bgColor=e.target.value||'#fff'; draw();});
  const sizeVal=byId('size-val'); const sync=()=>sizeVal.textContent=fontSize+'px';
  sync();
  byId('font-size-up').addEventListener('click',()=>{fontSize=Math.min(fontSize+4,96); for(const o of chars)o.size=fontSize; sync(); draw();});
  byId('font-size-down').addEventListener('click',()=>{fontSize=Math.max(fontSize-4,10); for(const o of chars)o.size=fontSize; sync(); draw();});
  byId('clear-btn').addEventListener('click',()=>{chars=[];trail=[];draw();drawingInput.focus()});
  byId('save-btn').addEventListener('click',()=>{const a=document.createElement('a');a.download='typography-art.png';a.href=canvas.toDataURL('image/png');a.click()});
  canvas.addEventListener('click',()=>{if(activeModule==='textDrawing')drawingInput.focus()});
})();

/* Typography — 입력창 항상 보이기 + 최신 문장 강조 */
(function(){
  const sentences=byId('sentences');
  const cursor=byId('cursor'); const dot=byId('cursor-dot');
  const typing=byId('typing-area'); const input=byId('hidden-input');
  let typed='';

  const init=[
    "단어들이 춤추는 디지털 공간에, 오신 것을 환영합니다",
    "마우스를 클릭해 단어들과 상호작용해 보세요",
    "클릭 한 번에 단어가 파동처럼 퍼져나갑니다",
    "입력해보세요, 오직 당신만의 문장이 생성됩니다",
    "타이포그래피는 소리 없는 목소리입니다",
    "글자는 시간과 공간을 담는 그릇입니다",
    "언어는 우리의 가장 오래된 인터페이스입니다",
    "생각이 말로 흐르고, 말이 글로 영속됩니다",
    "간결함 속에 담긴 깊은 의미를 찾아보세요",
    "글자가 문장을 엮고, 그 문장이 이야기를 만듭니다"
  ];

  function highlightTop(el){
    // 기존 최상단 강조 해제
    const prev = sentences.querySelector('.sentence.headline');
    if(prev){ prev.classList.remove('headline'); }
    // 새 요소 강조
    el.classList.add('headline');
  }

  function makeSentence(t, shouldHighlight=false){
    const el=document.createElement('div'); el.className='sentence';
    t.split(' ').forEach((w,i)=>{
      const span=document.createElement('span'); span.className='word'; span.textContent=w;
      span.addEventListener('mouseover',()=>{if(activeModule!=='typography')return; span.classList.add('active')});
      span.addEventListener('mouseout',()=>span.classList.remove('active'));
      el.appendChild(span); if(i<t.length-1) el.appendChild(document.createTextNode(' '));
    });
    sentences.firstChild?sentences.insertBefore(el,sentences.firstChild):sentences.appendChild(el);
    el.style.opacity='0'; el.style.transform='translateY(-20px)';
    requestAnimationFrame(()=>{
      el.style.transition='all .5s ease';
      el.style.opacity='.25';
      el.style.transform='translateY(0)';
      if(shouldHighlight){ highlightTop(el); }
    });
    setTimeout(()=>sentences.scrollTop=0,100);
  }

  // 초기 문장들(강조 없이)
  init.forEach(s => makeSentence(s, false));

  // 마우스 포인터
  document.addEventListener('mousemove',e=>{
    if(activeModule!=='typography')return;
    const x=e.clientX,y=e.clientY;
    cursor.style.left=x+'px'; cursor.style.top=y+'px';
    dot.style.left=x+'px'; dot.style.top=y+'px';
  });

  // 모듈 진입시 입력 포커스
  modules.typography.addEventListener('click',()=>{
    if(activeModule!=='typography')return;
    input.focus();
  });

  // 입력창 항상 보이기 + 실시간 반영
  input.addEventListener('input',()=>{
    if(activeModule!=='typography')return;
    typed=input.value;
    typing.textContent=typed; // 비어있으면 :empty::before가 플레이스홀더 표시
  });

  // Enter 시 문장 추가 + 최상단 검정 강조
  input.addEventListener('keydown',e=>{
    if(activeModule!=='typography')return;
    if(e.key==='Enter' && typed.trim()){
      makeSentence(typed.trim(), true);
      typed=''; input.value=''; typing.textContent='';
      e.preventDefault();
    }
  });
})();

/* Playground — 줄바꿈(10자) + 항상 중앙폭 맞춤 */
(function(){
  const box=byId('text-container'), input=byId('textInput'), modeSel=byId('morphMode'), color=byId('color-picker'), fontSel=byId('pg-font-select'), indicator=byId('mode-indicator');
  let isDrag=false,sx=0,sy=0,text='안녕',mode='drag',raf=0,last=0,intensity=10;

  const esc=s=>s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const chunk=(t,n=10)=>{const out=[];for(let i=0;i<t.length;i+=n)out.push(t.slice(i,i+n));return out;};

  const measCanvas=document.createElement('canvas');
  const mctx=measCanvas.getContext('2d');
  function computeLineWidth(line){
    const fs=parseFloat(getComputedStyle(box).fontSize);
    const ff=getComputedStyle(box).fontFamily||'Pretendard,sans-serif';
    mctx.font=`${fs}px ${ff}`;
    return mctx.measureText(line).width;
  }
  function fitToWidest(){
    const lines = chunk(text,10);
    const widest = Math.max(1, ...lines.map(l => computeLineWidth(l)));
    const pad = 16;
    const target = Math.min(widest + pad, window.innerWidth * 0.9);
    box.style.width = target + 'px';
    box.style.marginLeft = 'auto';
    box.style.marginRight = 'auto';
  }

  function renderPlain(){
    const lines=chunk(text,10).map(l=>`<div class="line">${esc(l)}</div>`).join('');
    box.innerHTML=lines;
    fitToWidest();
  }
  function renderAnim(){
    const tt=Date.now()/300;
    const html=chunk(text,10).map((ln,li)=>{
      const chars=ln.split('').map((ch,i)=>{
        if(mode==='wave'){const off=Math.sin(tt+i*.5+li*.3)*intensity;const rot=Math.sin(tt+i*.3+li*.2)*2;
          return `<span style="display:inline-block;transform:translateY(${off}px) rotate(${rot}deg);transition:transform .1s ease">${esc(ch)}</span>`;
        }else if(mode==='twist'){const rot=Math.sin(tt+i*.8+li*.4)*intensity*3;const sc=1+Math.sin(tt+i*.4+li*.2)*.1;
          return `<span style="display:inline-block;transform:rotate(${rot}deg) scale(${sc});transition:transform .1s ease">${esc(ch)}</span>`;
        }else if(mode==='shake'){const ox=(Math.random()-.5)*intensity,oy=(Math.random()-.5)*intensity,rot=(Math.random()-.5)*10;
          return `<span style="display:inline-block;transform:translate(${ox}px,${oy}px) rotate(${rot}deg)">${esc(ch)}</span>`;
        }else if(mode==='explode'){const ox=(Math.random()-.5)*intensity*2,oy=(Math.random()-.5)*intensity*2,rot=(Math.random()-.5)*18;
          return `<span style="display:inline-block;transform:translate(${ox}px,${oy}px) rotate(${rot}deg)">${esc(ch)}</span>`;
        }else{
          return `<span>${esc(ch)}</span>`;
        }
      }).join('');
      return `<div class="line">${chars}</div>`;
    }).join('');
    box.innerHTML=html;
    fitToWidest();
  }
  function start(){cancelAnimationFrame(raf); const loop=(ts=0)=>{if(activeModule!=='playground'){cancelAnimationFrame(raf);return;} if(ts-last<16){raf=requestAnimationFrame(loop);return;} last=ts; renderAnim(); raf=requestAnimationFrame(loop)}; raf=requestAnimationFrame(loop)}
  function stop(){cancelAnimationFrame(raf)}
  function reset(){
    stop(); box.style.transform='none'; box.style.transition='transform .3s ease'; box.style.cursor=(mode==='drag'?'grab':'auto');
    ['wave','twist','shake','explode'].includes(mode)?start():renderPlain();
  }

  input.addEventListener('input',e=>{text=e.target.value||'안녕'; reset();});
  color.addEventListener('input',e=>{box.style.color=e.target.value});
  fontSel.addEventListener('change',e=>{box.style.fontFamily=`'${e.target.value}',sans-serif`; fitToWidest();});

  document.addEventListener('keydown',e=>{
    if(activeModule!=='playground')return;
    if(e.code==='Space'){e.preventDefault(); const opts=modeSel.options; modeSel.selectedIndex=(modeSel.selectedIndex+1)%opts.length; modeSel.dispatchEvent(new Event('change')); return;}
    if(e.key.startsWith('Arrow')){e.preventDefault(); if(e.key==='ArrowUp')intensity=Math.min(intensity+5,30); if(e.key==='ArrowDown')intensity=Math.max(intensity-5,5); indicator.textContent=`${mode} 모드 (강도: ${intensity})`; setTimeout(()=>indicator.textContent=`${mode} 모드`,900);}
    if(mode==='type'){
      if(e.key==='Backspace'){const cur=box.textContent||''; if(cur.length){const nt=cur.slice(0,-1); box.textContent=nt; input.value=nt; text=nt; renderPlain();}}
      else if(e.key.length===1&&!e.ctrlKey&&!e.altKey&&!e.metaKey){const cur=box.textContent||''; const nt=(cur+e.key).slice(0,200); box.textContent=nt; input.value=nt; text=nt; box.style.transform='scale(1.02)'; setTimeout(()=>box.style.transform='none',90); renderPlain();}
    }
  });

  box.addEventListener('mousedown',e=>{if(activeModule!=='playground')return; if(mode==='drag'){isDrag=true; sx=e.clientX; sy=e.clientY; box.style.transition='none'; box.style.cursor='grabbing';}});
  document.addEventListener('mousemove',e=>{if(activeModule!=='playground')return; if(isDrag&&mode==='drag'){const dx=e.clientX-sx,dy=e.clientY-sy; const rot=dx/15; box.style.transform=`translate(${dx}px,${dy}px) rotate(${rot}deg)`;}});
  document.addEventListener('mouseup',()=>{if(isDrag){isDrag=false; box.style.transition='transform .3s ease'; box.style.transform='none'; box.style.cursor='grab';}});

  modeSel.addEventListener('change',e=>{mode=e.target.value; indicator.textContent=`${mode} 모드`; box.style.cursor=(mode==='drag'?'grab':'auto'); reset();});
  addEventListener('resize',()=>{fitToWidest()},{passive:true});

  renderPlain();
})();

/* 우산 */
(function(){
  const mod=byId('umbrella-module'),wrap=byId('umbrella-wrap'),c=byId('umbrella-canvas'),g=c.getContext('2d',{alpha:true});
  const DPR=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  function resize(){c.width=Math.floor(innerWidth*DPR);c.height=Math.floor(innerHeight*DPR);c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';g.setTransform(DPR,0,0,DPR,0,0)} addEventListener('resize',resize,{passive:true}); resize();
  const colors=["#0066cc","#222","#0044aa","#005577","#8800cc","#008855","#cc6600","#990000"]; let idx=0; wrap.addEventListener('click',()=>{if(activeModule!=='umbrella')return; idx=(idx+1)%colors.length; mod.style.background=colors[idx];});
  const bg=byId('umb-bgRain'),d1=byId('umb-drop1'),d2=byId('umb-drop2'),b1=byId('umb-bounce1'),b2=byId('umb-bounce2'); bg.volume=.25; const drops=[d1,d2],bounces=[b1,b2]; wrap.addEventListener('click',()=>{if(activeModule!=='umbrella')return; bg.play().catch(()=>{})},{once:true});
  function play(a,v=1){const s=a[(Math.random()*a.length)|0].cloneNode(); s.volume=v; s.play()}
  const JAMO="ㄱ ㄴ ㄷ ㄹ ㅁ ㅂ ㅅ ㅇ ㅈ ㅊ ㅋ ㅌ ㅍ ㅎ ㅏ ㅓ ㅗ ㅜ ㅡ ㅣ".split(" "); const ch=a=>a[(Math.random()*a.length)|0], R=(a,b)=>a+Math.random()*(b-a);
  const BASE=.03,MAX=320,FONT=34,AIR=.996,MINUP=3,UPG=.5,KICK=.55;
  const umbImg=byId('umbrella-img'); const umb={x:innerWidth/2,y:innerHeight/3,r:Math.min(innerWidth,innerHeight)*.12,follow(x,y){this.x=x;this.y=y;umbImg.style.left=x+'px';umbImg.style.top=y+'px'}};
  wrap.addEventListener('mousemove',e=>{if(activeModule!=='umbrella')return; umb.follow(e.clientX,e.clientY)},{passive:true});
  wrap.addEventListener('touchmove',e=>{if(activeModule!=='umbrella')return; const t=e.touches[0]; umb.follow(t.clientX,t.clientY)},{passive:true});
  const emit=[],N=7; for(let i=0;i<N;i++){const x0=(i+.5)/N*innerWidth; emit.push({xMin:Math.max(0,x0-innerWidth*(.5/N)),xMax:Math.min(innerWidth,x0+innerWidth*(.5/N)),rate:4.5+Math.random()*3,nextAt:0})}
  const exp=r=>-Math.log(1-Math.random())/r; const ps=[]; let T=0;
  class P{constructor(){this.reset(true)} reset(f=false){this.char=ch(JAMO);this.size=FONT+R(-3,3);this.x=R(0,innerWidth);this.y=f?R(-innerHeight*.8,innerHeight*.6):-20;this.vx=R(-.25,.25);this.vy=R(.4,1.5);this.spin=R(-.02,.02);this.rot=R(-Math.PI,Math.PI);this.g=BASE*R(.85,1.15);this.drag=AIR*R(.993,.999);this.seed=Math.random()*1000;this.active=true;this.respawnAt=0}
    sched(d){this.active=false;this.respawnAt=T+d;this.xNext=R(0,innerWidth);this.vxNext=R(-.25,.25);this.vyNext=R(.5,1.4)}
    maybe(){if(!this.active&&T>=this.respawnAt){this.active=true;this.x=this.xNext;this.y=-20;this.vx=this.vxNext;this.vy=this.vyNext;this.g=BASE*R(.85,1.15);this.drag=AIR*R(.993,.999);this.seed=Math.random()*1000;play(drops,.12)}}
    step(t){if(!this.active){this.maybe();return} const w=Math.sin(t*1.35+this.seed*2.11)*.016+Math.cos(t*.72+this.seed*5.29)*.011; this.vx+=w; this.vy+=this.g; this.vx*=this.drag; this.vy*=this.drag; this.x+=this.vx; this.y+=this.vy; this.rot+=this.spin;
      const dx=this.x-umb.x,dy=this.y-umb.y,dist=Math.hypot(dx,dy),Rr=umb.r; if(dist<Rr){const nx=dx/(dist||1),ny=dy/(dist||1),dot=this.vx*nx+this.vy*ny; this.vx-=2*dot*nx; this.vy-=2*dot*ny; const up=Math.max(MINUP,Math.abs(dot)*MINUP*UPG+MINUP); this.vy=-up; this.vx+=(Math.random()-.5)*KICK; const push=Rr-dist+.8; this.x+=nx*push; this.y+=ny*push; play(bounces,.25)}
      if(this.y<-60||this.y>innerHeight+100){this.sched(Math.random()*.55+.05);return}}
    draw(){if(!this.active)return; g.save(); g.translate(this.x,this.y); g.rotate(this.rot); g.font=`${this.size}px Pretendard`; g.textAlign='center'; g.textBaseline='alphabetic'; g.fillStyle='white'; g.fillText(this.char,0,0); g.restore()}
  }
  for(let i=0;i<160;i++)ps.push(new P(true)); for(const e of emit){e.nextAt=exp(e.rate)}
  let last=performance.now(); (function frame(now){if(activeModule!=='umbrella'){last=now;requestAnimationFrame(frame);return} const dt=Math.min(.05,(now-last)/1000); last=now; T+=dt;
    for(const e of emit){while(T>=e.nextAt&&ps.length<MAX){const p=new P(false); p.x=R(e.xMin,e.xMax); p.y=-20; ps.push(p); e.nextAt+=exp(e.rate)}}
    g.clearRect(0,0,innerWidth,innerHeight); const t=T; for(const p of ps){p.step(t); p.draw()} requestAnimationFrame(frame)})(performance.now());
})();

document.getElementById('home-button').addEventListener('click',e=>{e.preventDefault();location.href='index.html#list-section';});
