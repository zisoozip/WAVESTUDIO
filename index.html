:root {
  --menu-header-size: clamp(20px, 2.4vw, 36px);
  --menu-title-size: clamp(24px, 3.0vw, 42px);
  --menu-base-size: clamp(38px, 6.5vw, 76px);
  --marquee-height: clamp(64px, 13vh, 120px);
}

.list-section {
  font-size: var(--menu-base-size);
  height: 100vh;
  overflow: hidden;
  padding-top: calc(55px + var(--safe-area-top));
}

.header {
  height: auto;
  min-height: clamp(55px, 11vh, 110px);
  align-items: center;
  padding: 18px 0;
}

.fixed { font-size: var(--menu-title-size); }

.top-left, .top-right {
  margin-left: 28px;
  margin-right: 28px;
}

.marquee-container {
  width: 100%;
  max-height: calc(100vh - 200px - var(--safe-area-top) - var(--safe-area-bottom));
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  padding-right: 10px;
}

.marquee-canvas {
  height: var(--marquee-height);
  display: block;
}

.hr-line {
  height: 3px !important;
  margin: 24px 0 !important;
}

.marquee-canvas:hover {
  transform: translateX(10px);
}

@media screen and (max-height: 800px) {
  :root {
    --menu-base-size: clamp(30px, 5.2vw, 58px);
    --marquee-height: clamp(48px, 9vh, 88px);
  }
  .header { min-height: clamp(48px, 8vh, 76px); }
  .marquee-container {
    max-height: calc(100vh - 140px - var(--safe-area-top) - var(--safe-area-bottom));
  }
  .hr-line {
    height: 2px !important;
    margin: 18px 0 !important;
  }
}

@media screen and (min-width: 1680px) and (min-height: 900px) {
  :root {
    --menu-base-size: clamp(34px, 3.8vw, 64px);
    --marquee-height: clamp(56px, 9.5vh, 108px);
  }
}

.sphere-section .type-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  justify-items: stretch;
  gap: 1.5rem;
  width: min(90%, 1200px);
}

.sphere-section .big-words {
  grid-column: 1 / span 2;
  text-align: center;
}

.sphere-section .round-word {
  grid-column: 1;
  justify-self: start;
  align-self: center;
}

.sphere-section .quote {
  grid-column: 2;
  justify-self: end;
  align-self: center;
  text-align: right;
  max-width: 400px;
  margin-right: 60px;
}

@media (max-width: 768px) {
  .sphere-section .type-layout {
    grid-template-columns: 1fr;
  }
  .sphere-section .big-words { grid-column: 1; }
  .sphere-section .round-word { grid-column: 1; justify-self: start; align-self: center; }
  .sphere-section .quote { grid-column: 1; justify-self: end; text-align: right; align-self: center; margin-right: 60px; }
}

.menu-section {
  margin: 0;
  padding: 0;
  border: none !important;
  outline: none !important;
  overflow: hidden;
}

html, body {

  padding: 0;

(function initBackgroundMusic() {
  const bgMusic = document.getElementById('bgMusic');

  function attemptPlay() {
    const playPromise = bgMusic.play();
    
    if (playPromise !== undefined) {
      playPromise
        .then(() => {
          console.log('Background music started');
          document.removeEventListener('click', attemptPlay);
          document.removeEventListener('touchstart', attemptPlay);
          document.removeEventListener('keydown', attemptPlay);
        })
        .catch(error => {
          console.log('Autoplay prevented, waiting for user interaction');
        });
    }
  }

  attemptPlay();

  document.addEventListener('click', attemptPlay, { once: true });
  document.addEventListener('touchstart', attemptPlay, { once: true });
  document.addEventListener('keydown', attemptPlay, { once: true });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      bgMusic.pause();
    } else {
      bgMusic.play().catch(() => {});
    }
  });
})();

(function syncHashToSlide() {
  const hashToIndex = {
    'list-section': 3,
  };

  function applyHash() {
    const raw = (window.location.hash || '').replace('#', '');
    const index = hashToIndex[raw];
    if (typeof index === 'number') {
      if (window.appState && typeof window.appState.goToSlide === 'function') {
        window.appState.goToSlide(index);
      } else if (typeof window.goToSlide === 'function') {
        window.goToSlide(index);
      }
      window.scrollTo(0, 0);
      if (history.replaceState) { history.replaceState(null, '', window.location.pathname); } else { window.location.hash = ''; }
    }
  }

  window.addEventListener('DOMContentLoaded', applyHash);
  window.addEventListener('load', applyHash);
})();

if (window.matchMedia('(pointer: coarse)').matches) {
  document.body.style.overflow = 'hidden';
  document.documentElement.style.overflow = 'hidden';
  
  let preventScroll = (e) => {
    if(e.target.closest('.horizontal-container')){
      e.preventDefault();
    }
  };
  
  document.addEventListener('touchmove', preventScroll, { passive: false });
}

const statusBarHeight = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--safe-area-top')) || 0;
if(statusBarHeight > 20) {
  document.documentElement.style.setProperty('--safe-area-top', statusBarHeight + 'px');
}

if(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
  document.body.classList.add('pwa-mode');
}

const appBadge = navigator.setAppBadge || navigator.setExperimentalAppBadge;

  try {

  }
}

(function () {
  function onWheel(e) {
    if (window.appState && typeof window.appState.handleWheel === 'function') {
      const target = e.target.closest ? e.target.closest('.horizontal-container, #list-section') : null;
      if (target) {
        e.preventDefault();
        window.appState.handleWheel(e);
      }
    }
  }
  window.addEventListener('wheel', onWheel, { passive: false });
})();
