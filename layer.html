<!DOCTYPE html>
<html lang=ko>
<head>
<meta charset=UTF-8>
<meta name=viewport content="width=device-width, initial-scale=1.0">
<title>2분할 레이아웃</title>
<style>
  body{margin:0;padding:0;display:flex;height:100vh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Arial,sans-serif;background-color:#fff;color:#000}

  /* 헤더 안으로 들어간 홈 버튼 */
  #home-button{
    position:static; /* 헤더 플로우 안에 배치 */
    z-index:1001;
    width:40px;height:40px;
    background:linear-gradient(135deg,rgba(0,0,0,0.1) 0,rgba(0,0,0,0.2) 100%);
    backdrop-filter:blur(20px);
    border:1px solid rgba(0,0,0,0.15);
    border-radius:50%;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .3s ease;
    box-shadow:0 6px 20px rgba(0,0,0,0.25);
    text-decoration:none;
  }
  #home-button:hover{background:linear-gradient(135deg,rgba(0,0,0,0.2) 0,rgba(0,0,0,0.3) 100%);transform:translateY(-1px) scale(1.03);box-shadow:0 10px 28px rgba(0,0,0,0.35)}
  #home-button svg{width:20px;height:20px;fill:rgba(102,102,102,0.85);transition:all .3s ease}
  #home-button:hover svg{fill:rgba(102,102,102,1)}

  .left-panel{width:50%;background-color:#fff;padding:20px;position:fixed;height:100vh;overflow:hidden;border-right:1px solid #000;box-sizing:border-box;display:flex;color:#000;flex-direction:column}
  .right-panel{width:50%;background-color:#fff;padding:20px;overflow-y:auto;margin-left:50%;box-sizing:border-box;display:flex;color:#000;flex-direction:column}
  .content,.left-content{max-width:100%;text-align:left}
  .content img{max-width:20%;margin:10px;cursor:pointer;border:.2px solid #d1d1d1}
  .left-main-image{max-width:60%;margin:20px auto;display:block;border:.2px solid #d1d1d1;transition:opacity 0.8s ease-in-out}
  /* 교차 전환 시 페이드 아웃 */
  .left-main-image.is-fading{opacity:0}

  .image-group{display:flex;flex-wrap:wrap;justify-content:center}

  /* 헤더: 버튼 + 텍스트를 한 줄 정렬 */
  .header{
    position:fixed;top:0;left:0;width:50%;
    background-color:#fff;padding:12px 20px;
    z-index:10;text-align:left;box-sizing:border-box;
    border-bottom:1px solid #000;font-weight:bold;color:#000;
    display:flex;align-items:center;gap:12px;
  }
  .header-title{display:inline-block;line-height:1}

  .right-header{position:fixed;top:0;left:50%;width:50%;background-color:#fff;padding:20px;z-index:10;text-align:left;box-sizing:border-box;border-bottom:1px solid #000;font-weight:bold;color:#000}
  .content-wrapper{margin-top:60px;flex-grow:1}
  .popup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background-color:rgba(0,0,0,0.8);z-index:1000;justify-content:center;align-items:center}
  .popup img{max-width:90%;max-height:90%}
  .close-btn{position:absolute;top:20px;right:20px;color:#fff;font-size:30px;cursor:pointer}

  @media screen and (max-width:1024px){.content img{max-width:45%}}

  @media screen and (max-width:768px){
    body{flex-direction:column;overflow-y:auto;height:auto}
    /* 모바일에서 버튼 살짝 더 작게 */
    #home-button{width:36px;height:36px}
    #home-button svg{width:18px;height:18px}

    .left-panel{width:100%;position:relative;height:auto;min-height:200px;border-right:0;border-bottom:1px solid #000}
    .right-panel{width:100%;margin-left:0;margin-top:0}
    .header{width:100%;position:relative;padding:12px 15px}
    .right-header{width:100%;left:0;top:auto;position:relative}
    .content-wrapper{margin-top:20px}
    .content img{max-width:90%}
  }

  @media screen and (max-width:480px){
    #home-button{width:32px;height:32px}
    #home-button svg{width:16px;height:16px}
    .image-group{flex-direction:column;align-items:center}
    .content img{max-width:100%}
    .header,.right-header{padding:12px 15px}
    .left-panel,.right-panel{padding:15px}
    .left-main-image{max-width:100%}
  }
</style>
</head>
<body>

<div class=left-panel>
  <div class="header">
    <!-- 헤더 내부 왼쪽에 홈 버튼 배치 -->
    <a id="home-button" href="#" aria-label="홈으로 이동">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
    </a>
    <span class="header-title">Main Poster</span>
  </div>

  <div class="left-content content-wrapper">
    <p>파동과 선이 겹쳐지며 만들어내는 장면을 기록합니다 이곳은 고정된 공간으로, 작품의 흐름을 안내하는 역할을 합니다.</p>
    <!-- ▼ 여기의 data-rotate-srcs 값을 원하는 두 장으로 바꾸세요 (| 로 구분) -->
    <img
      src="image/z.png"
      data-rotate-srcs="image/z.png|image/w.png"
      alt="메인 이미지"
      class="left-main-image"
    >
  </div>
</div>

<div class=right-panel>
  <div class=right-header>Mini Postcard</div>
  <div class="content content-wrapper">
    <p>이미지와 텍스트가 교차하며 전개되는 공간입니다 각 장면은 파동처럼 이어지고, 사용자는 이를 따라가며 새로운 감각과 시각적 경험을 탐색할 수 있습니다.</p>
    <div class=image-group>
      <img src="image/01 (6)6.png" alt="사진 1">
      <img src="image/01 (3).png" alt="사진 2">
      <img src="image/01 (5)5.png" alt="사진 5">
      <img src="image/01 (2).png" alt="사진 6">
    </div>
    <p>사진과 기록이 쌓여가며 하나의 이야기로 확장됩니다 단순한 나열이 아니라 흐름과 리듬 속에서 읽히는 공간 그 안에서 작은 파편들이 모여 전체를 완성합니다.</p>
    <div class=image-group>
      <img src="image/01 (4).png" alt="사진 3">
      <img src="image/01 (3).png" alt="사진 4">
      <img src="image/01 (5).png" alt="사진 5">
      <img src="image/01 (2).png" alt="사진 6">
      <img src="image/01 (6).png" alt="사진 5">
      <img src="image/01 (2).png" alt="사진 6">
      <img src="image/01 (7).png" alt="사진 5">
      <img src="image/01 (2).png" alt="사진 6">
    </div>
  </div>
</div>

<div class=popup id=imagePopup>
  <span class=close-btn onclick=closePopup()>×</span>
  <img id=popupImage src>
</div>

<script>
/* 홈 버튼 내비게이션 */
(function(){
  const btn = document.getElementById('home-button');
  if (!btn) return;
  btn.addEventListener('click', function(e){
    e.preventDefault();
    var basePath = window.location.pathname.replace(/[^\/]*$/, '');
    var target = basePath + 'index.html#list-section';
    fetch(target, {method: 'HEAD'}).then(function(res){
      if (res.ok) {
        window.location.href = target;
      } else {
        var parentTarget = basePath.replace(/[^\/]+\/$/, '') + 'index.html#list-section';
        window.location.href = parentTarget;
      }
    }).catch(function(){
      window.location.href = target;
    });
  });
})();
</script>

<script>
/* 팝업 확대 보기 */
document.querySelectorAll('.image-group img, .left-main-image').forEach(img=>{
  img.addEventListener('click',function(){
    const popup=document.getElementById('imagePopup');
    const popupImg=document.getElementById('popupImage');
    popupImg.src=this.src;
    popup.style.display='flex';
  });
});
function closePopup(){document.getElementById('imagePopup').style.display='none';}
document.getElementById('imagePopup').addEventListener('click',function(e){if(e.target===this){closePopup();}});
</script>

<script>
/* 왼쪽 메인 이미지 자동 교체 (두 장 교차, 부드러운 페이드) */
(function(){
  const imgEl = document.querySelector('.left-main-image');
  if (!imgEl) return;

  // data-rotate-srcs="a|b" 에서 두 장 추출
  const listAttr = imgEl.getAttribute('data-rotate-srcs') || '';
  const list = listAttr.split('|').map(s => s.trim()).filter(Boolean);

  // 유효한 2장만 사용 (안 넣었으면 현재 src 기준으로 중복 방지)
  let sources = [];
  if (list.length >= 2) {
    sources = [list[0], list[1]];
  } else {
    const current = imgEl.src;
    const fallback = current;
    sources = [current, fallback];
  }

  // 두 장이 서로 다를 때만 동작
  if (sources[0] === sources[1]) return;

  // 프리로드
  sources.forEach(src => {
    const p = new Image();
    p.src = src;
  });

  let idx = 0;
  const DURATION = 2000;   // 교체 간격(ms) -> 2초
  const FADE_MS  = 800;    // 페이드 시간(ms)

  function swap(){
    imgEl.classList.add('is-fading');
    setTimeout(()=>{
      idx = (idx + 1) % sources.length;
      imgEl.src = sources[idx];
      imgEl.classList.remove('is-fading');
    }, FADE_MS);
  }

  // 마우스 올렸을 때 멈추고, 떼면 다시 진행 (작품 관람 UX)
  let timer = setInterval(swap, DURATION);
  imgEl.addEventListener('mouseenter', ()=>{ clearInterval(timer); });
  imgEl.addEventListener('mouseleave', ()=>{ timer = setInterval(swap, DURATION); });
})();
</script>

</body>
</html>
